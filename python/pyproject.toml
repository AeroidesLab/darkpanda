[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpanda-native"
version = "0.1.0"
description = "Direct in-process ctypes API for DarkPanda"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["darkpanda"]
include-package-data = true

[tool.setuptools.package-data]
darkpanda = ["*.dll", "*.so", "*.dylib"]
