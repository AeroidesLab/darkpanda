[package]
name = "wreq_transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Windows-first C ABI transport backed by wreq"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
hickory-resolver = { version = "=0.26.1", default-features = false, features = ["tokio"] }
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
wreq = { version = "=6.0.0-rc.29", default-features = false, features = [
    "brotli",
    "deflate",
    "gzip",
    "stream",
    "tokio-rt",
    "ws",
    "zstd",
] }
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = [
    "emulation",
    "emulation-compression",
] }

[target.'cfg(windows)'.dependencies]
schannel = "=0.1.29"

[dev-dependencies]
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }

[profile.release]
panic = "unwind"

[patch.crates-io]
wreq = { path = "vendor/wreq" }
