<!DOCTYPE html>
<body></body>
<script src="../testing.js"></script>
<script id=createElement>
  testing.expectEqual(1, document.createElement.length);

  testing.withError(error => {
    const message = "Failed to execute 'createElement' on 'Document': 1 argument required, but only 0 present.";
    testing.expectEqual('TypeError', error.name);
    testing.expectEqual(message, error.message);
    testing.expectEqual('TypeError: 1 argument required, but only 0 present.', String(error.stack).split('\n')[0]);
    testing.expectEqual(
      {value: message, writable: true, enumerable: true, configurable: true},
      Object.getOwnPropertyDescriptor(error, 'message'),
    );
  }, () => document.createElement());

  const div1 = document.createElement('div');
  testing.expectEqual(true, div1 instanceof HTMLDivElement);
  testing.expectEqual("DIV", div1.tagName);
  div1.id = "hello";
  testing.expectEqual(null, $('#hello'));

  const div2 = document.createElement('DIV');
  testing.expectEqual(true, div2 instanceof HTMLDivElement);

  document.getElementsByTagName('body')[0].appendChild(div1);
  testing.expectEqual(div1, $('#hello'));
</script>
