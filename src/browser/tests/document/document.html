<script id=document_metadata>
  // Test document metadata properties on HTML document
  testing.expectEqual('text/html', document.contentType);
  testing.expectEqual('UTF-8', document.characterSet);
  testing.expectEqual('UTF-8', document.charset);
  testing.expectEqual('UTF-8', document.inputEncoding);
  testing.expectEqual('CSS1Compat', document.compatMode);
  testing.expectEqual(document.URL, document.documentURI);
  testing.expectEqual('', document.referrer);
  testing.expectEqual(testing.HOST, document.domain);

  document.domain = testing.HOST;
  testing.expectEqual(testing.HOST, document.domain);
  testing.expectError('SecurityError', () => { document.domain = 'example.org'; });
  testing.expectError('SecurityError', () => { document.domain = 'com'; });
  testing.expectError('SecurityError', () => { document.domain = ''; });

  testing.expectEqual(testing.HOST, document.domain);

    'open',

    'querySelectorAll',
    'replaceChildren',

    'writeln',
  ];
  const implementedPrototypeSet = new Set(implementedPrototypeNames);
  testing.expectEqual(
    implementedPrototypeNames,
    Reflect.ownKeys(Document.prototype).filter(key => implementedPrototypeSet.has(key)),
  );
  testing.expectFalse(Object.hasOwn(Document.prototype, 'location'));
  testing.expectFalse(Object.hasOwn(HTMLDocument.prototype, 'location'));

  const stateNames = [
    'compatMode',
    'referrer',
    'hidden',
    'visibilityState',
    'prerendering',
  ];

  for (const name of stateNames) {
    const descriptor = Object.getOwnPropertyDescriptor(Document.prototype, name);
    testing.expectEqual('function', typeof descriptor.get);
    testing.expectEqual(`get ${name}`, descriptor.get.name);
    testing.expectEqual(0, descriptor.get.length);
    testing.expectEqual(undefined, descriptor.set);
    testing.expectTrue(descriptor.enumerable);
    testing.expectTrue(descriptor.configurable);
    testing.expectEqual(
      `function get ${name}() { [native code] }`,
      Function.prototype.toString.call(descriptor.get),
    );
  }

  const detached = new Document();
  testing.expectTrue(detached.hidden);
  testing.expectEqual('hidden', detached.visibilityState);
  testing.expectFalse(detached.prerendering);
  testing.expectEqual('', detached.referrer);

  const detachedHTML = document.implementation.createHTMLDocument('detached');
  testing.expectTrue(detachedHTML.hidden);
  testing.expectEqual('hidden', detachedHTML.visibilityState);
  testing.expectEqual('CSS1Compat', detachedHTML.compatMode);
</script>

<script id=document_location_legacy_unforgeable_chrome149>
  function checkLocationOwnProperty(target, expectedValue) {
    testing.expectEqual(['location'], Reflect.ownKeys(target));
    testing.expectEqual(expectedValue, target.location);

    const descriptor = Object.getOwnPropertyDescriptor(target, 'location');
    testing.expectEqual('function', typeof descriptor.get);
    testing.expectEqual('get location', descriptor.get.name);
    testing.expectEqual(0, descriptor.get.length);
    testing.expectEqual('function get location() { [native code] }', Function.prototype.toString.call(descriptor.get));
    testing.expectEqual('function', typeof descriptor.set);
    testing.expectEqual('set location', descriptor.set.name);
    testing.expectEqual(1, descriptor.set.length);
    testing.expectEqual('function set location() { [native code] }', Function.prototype.toString.call(descriptor.set));
    testing.expectTrue(descriptor.enumerable);
    testing.expectFalse(descriptor.configurable);
  }

  checkLocationOwnProperty(document, window.location);
  checkLocationOwnProperty(new Document(), null);
  checkLocationOwnProperty(document.implementation.createHTMLDocument('location'), null);
</script>

<script id=document_compatibility_mode_chrome149>
  const parser = new DOMParser();
  const quirks = parser.parseFromString('<p>no doctype</p>', 'text/html');
  testing.expectEqual('BackCompat', quirks.compatMode);
  testing.expectEqual(quirks.body, quirks.scrollingElement);

  const standards = parser.parseFromString('<!doctype html><p>standards</p>', 'text/html');
  testing.expectEqual('CSS1Compat', standards.compatMode);
  testing.expectEqual(standards.documentElement, standards.scrollingElement);
  standards.doctype.remove();
  // Compatibility mode is fixed by parsing; it is not derived live from the
  // current doctype node.
  testing.expectEqual('CSS1Compat', standards.compatMode);

  const invalidName = parser.parseFromString('<!doctype nothtml><p>x</p>', 'text/html');
  testing.expectEqual('BackCompat', invalidName.compatMode);

  const legacyQuirks = parser.parseFromString(
    '<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"><p>x</p>',
    'text/html',
  );
  testing.expectEqual('BackCompat', legacyQuirks.compatMode);

  const limitedQuirks = parser.parseFromString(
    '<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd"><p>x</p>',
    'text/html',
  );
  testing.expectEqual('CSS1Compat', limitedQuirks.compatMode);
  testing.expectEqual(limitedQuirks.documentElement, limitedQuirks.scrollingElement);
</script>

<script id=document_srcdoc_compatibility_mode_chrome149>
  const srcdocCases = [
    '<p>no doctype</p>',
    '<!doctype html><p>standards</p>',
    '<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"><p>legacy quirks</p>',
    '<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd"><p>limited quirks</p>',
    '<!doctype nothtml><p>force quirks</p>',
  ];

  for (const source of srcdocCases) {
    const iframe = document.createElement('iframe');
    iframe.srcdoc = source;
    document.body.append(iframe);
    testing.expectEqual('CSS1Compat', iframe.contentDocument.compatMode);
    testing.expectEqual(iframe.contentDocument.documentElement, iframe.contentDocument.scrollingElement);
    iframe.remove();
  }

  const rewritten = document.createElement('iframe');
  rewritten.srcdoc = '<p>initial</p>';
  document.body.append(rewritten);
  rewritten.contentDocument.open();
  rewritten.contentDocument.write('<p>rewritten without a doctype</p>');
  rewritten.contentDocument.close();
  testing.expectEqual('CSS1Compat', rewritten.contentDocument.compatMode);
  testing.expectEqual(rewritten.contentDocument.documentElement, rewritten.contentDocument.scrollingElement);
  rewritten.remove();
</script>

<script id=document_iframe_referrer_policy_chrome149>
  const iframeReferrerPrototype = HTMLIFrameElement.prototype;
  const iframeReferrerDescriptor = Object.getOwnPropertyDescriptor(
    iframeReferrerPrototype,
    'referrerPolicy',
  );
  testing.expectEqual('function', typeof iframeReferrerDescriptor.get);
  testing.expectEqual('function', typeof iframeReferrerDescriptor.set);
  testing.expectTrue(iframeReferrerDescriptor.enumerable);
  testing.expectTrue(iframeReferrerDescriptor.configurable);

  const reflectionProbe = document.createElement('iframe');
  testing.expectEqual('', reflectionProbe.referrerPolicy);
  reflectionProbe.setAttribute('referrerpolicy', 'No-Referrer');
  testing.expectEqual('no-referrer', reflectionProbe.referrerPolicy);
  reflectionProbe.setAttribute('referrerpolicy', 'not-a-policy');
  testing.expectEqual('', reflectionProbe.referrerPolicy);

  const expectedParentOrigin = `${new URL(document.URL).origin}/`;
  const expectedParentURL = document.URL.split('#', 1)[0];
  const srcdocReferrerCases = [
    ['', expectedParentOrigin],
    ['no-referrer', ''],
    ['unsafe-url', expectedParentURL],
    ['origin', expectedParentOrigin],
  ];
  for (const [policy, expectedReferrer] of srcdocReferrerCases) {
    const policyFrame = document.createElement('iframe');
    policyFrame.referrerPolicy = policy;
    policyFrame.srcdoc = '<!doctype html><body>referrer policy</body>';
    document.body.append(policyFrame);
    testing.expectEqual('about:srcdoc', policyFrame.contentDocument.URL);
    testing.expectEqual(expectedReferrer, policyFrame.contentDocument.referrer);
    policyFrame.remove();
  }

  // Initial about:blank is a special synchronous commit: it ignores the
  // iframe policy and exposes the immediate creator URL verbatim.
  const policyBlank = document.createElement('iframe');
  policyBlank.referrerPolicy = 'no-referrer';
  policyBlank.src = 'about:blank';
  document.body.append(policyBlank);
  testing.expectEqual(document.URL, policyBlank.contentDocument.referrer);

  const nestedInBlank = policyBlank.contentDocument.createElement('iframe');
  nestedInBlank.src = 'about:blank';
  policyBlank.contentDocument.body.append(nestedInBlank);
  testing.expectEqual('about:blank', nestedInBlank.contentDocument.referrer);

  const srcdocParent = document.createElement('iframe');
  srcdocParent.srcdoc = '<!doctype html><body>srcdoc parent</body>';
  document.body.append(srcdocParent);
  const nestedInSrcdoc = srcdocParent.contentDocument.createElement('iframe');
  nestedInSrcdoc.src = 'about:blank';
  srcdocParent.contentDocument.body.append(nestedInSrcdoc);
  testing.expectEqual('about:srcdoc', nestedInSrcdoc.contentDocument.referrer);

  policyBlank.remove();
  srcdocParent.remove();
</script>

<script id=document_redirect_referrer_selection_chrome149 type=module>
  const state = await testing.async();

  async function navigateReferrerFrame(url) {
    const frame = document.createElement('iframe');
    const result = new Promise(resolve => {
      function receive(event) {
        if (event.source !== frame.contentWindow) return;
        window.removeEventListener('message', receive);
        resolve(event.data);
      }
      window.addEventListener('message', receive);
    });
    frame.src = url;
    document.body.append(frame);
    const value = await result;
    frame.remove();
    return value;
  }

  const crossRedirect = await navigateReferrerFrame('/referrer/redirect-cross-origin');
  const policyRedirect = await navigateReferrerFrame('/referrer/redirect-no-referrer');

  state.resolve({ crossRedirect, policyRedirect });
  await state.done(({ crossRedirect, policyRedirect }) => {
    testing.expectEqual('/referrer/final-cross-origin', crossRedirect.kind);
    testing.expectEqual(`${new URL(document.URL).origin}/`, crossRedirect.referrer);
    testing.expectEqual('/referrer/final-no-referrer', policyRedirect.kind);
    testing.expectEqual('', policyRedirect.referrer);
  });
</script>

<script id=links_live_collection>
  {
    // Test that document.links is a live collection
    const links = document.links;
    const initialLength = links.length;

    // Add a new link
    const newLink = document.createElement('a');
    newLink.href = '/new-page';
    newLink.textContent = 'New Link';
    document.body.appendChild(newLink);

    testing.expectEqual(initialLength + 1, links.length);
    testing.expectEqual(newLink, links[links.length - 1]);

    // Remove href attribute - should no longer be in links
    newLink.removeAttribute('href');
    testing.expectEqual(initialLength, links.length);

    // Add it back
    newLink.href = '/another-page';
    testing.expectEqual(initialLength + 1, links.length);

    // Remove the element
    newLink.remove();
    testing.expectEqual(initialLength, links.length);
  }
</script>

  testing.expectEqual('HTML', document.children.item(0).nodeName)
  testing.expectEqual('HTML', document.firstElementChild.nodeName);
  testing.expectEqual('HTML', document.lastElementChild.nodeName);
  testing.expectEqual(1, document.childElementCount);

  let nd = new Document();
  testing.expectEqual(0, nd.children.length);
  testing.expectEqual(null, nd.children.item(0));
  testing.expectEqual(null, nd.firstElementChild);
  testing.expectEqual(null, nd.lastElementChild);
  testing.expectEqual(0, nd.childElementCount);
</script>

<script id=adoptNode>
{
  // Adopting a Document throws NotSupportedError
  testing.withError((err) => {
    testing.expectEqual(9, err.code);
    testing.expectEqual("NotSupportedError", err.name);
  }, () => document.adoptNode(document));

  // Same-document adopt: returns the node, clears parent, owner unchanged
  const el = document.createElement('div');
  const child = document.createElement('span');
  el.appendChild(child);
  document.body.appendChild(el);
  testing.expectEqual(document.body, el.parentNode);
  testing.expectEqual(document, el.ownerDocument);
  testing.expectEqual(document, child.ownerDocument);

  testing.expectEqual(el, document.adoptNode(el));
  testing.expectEqual(null, el.parentNode);
  testing.expectEqual(child, el.firstChild);
  testing.expectEqual(document, el.ownerDocument);
  testing.expectEqual(document, child.ownerDocument);

  // Cross-document adopt: node + descendants retarget to the new document
  const otherDoc = new Document();
  testing.expectEqual(el, otherDoc.adoptNode(el));
  testing.expectEqual(null, el.parentNode);
  testing.expectEqual(child, el.firstChild);
  testing.expectEqual(otherDoc, el.ownerDocument);
  testing.expectEqual(otherDoc, child.ownerDocument);

  // Round-trip back to the main document
  testing.expectEqual(el, document.adoptNode(el));
  testing.expectEqual(document, el.ownerDocument);
  testing.expectEqual(document, child.ownerDocument);

  // Adopt across documents removes the node from its old parent
  const orphan = document.createElement('p');
  document.body.appendChild(orphan);
  testing.expectEqual(document.body, orphan.parentNode);
  const otherDoc2 = new Document();
  testing.expectEqual(orphan, otherDoc2.adoptNode(orphan));
  testing.expectEqual(null, orphan.parentNode);
  testing.expectEqual(otherDoc2, orphan.ownerDocument);

  // Adoption is shadow-including: the attached ShadowRoot and its descendants
  // retarget even though they are absent from the host's light child list.
  const shadowHost = document.createElement('section');
  const shadowRoot = shadowHost.attachShadow({mode: 'open'});
  const shadowChild = document.createElement('em');
  const lightChild = document.createElement('strong');
  shadowRoot.appendChild(shadowChild);
  shadowHost.appendChild(lightChild);
  const otherDoc3 = new Document();
  testing.expectEqual(shadowHost, otherDoc3.adoptNode(shadowHost));
  testing.expectEqual(otherDoc3, shadowHost.ownerDocument);
  testing.expectEqual(otherDoc3, shadowRoot.ownerDocument);
  testing.expectEqual(otherDoc3, shadowChild.ownerDocument);
  testing.expectEqual(otherDoc3, lightChild.ownerDocument);
}
</script>

<script id=adoptedStyleSheets>
  {
    const acss = document.adoptedStyleSheets;
    testing.expectEqual(0, acss.length);
    acss.push(new CSSStyleSheet());
    testing.expectEqual(1, acss.length);
  }
</script>
