<script id="worker_prototype_topology" type=module>
  {
    const state = await testing.async();
    const worker = new Worker('./prototype-topology-worker.js');

    worker.onmessage = event => state.resolve(event.data);

    await state.done((result) => {
      testing.expectTrue(result.nodeIsAbsent);
      testing.expectTrue(result.workerGlobalScopeIsDefined);
      testing.expectTrue(result.dedicatedWorkerGlobalScopeIsDefined);
      testing.expectTrue(result.selfIsDedicatedWorkerGlobalScope);
      testing.expectTrue(result.selfIsWorkerGlobalScope);
      testing.expectEqual('DedicatedWorkerGlobalScope', result.constructorName);
      testing.expectTrue(result.selfIsGlobalThis);
      testing.expectTrue(result.requestAnimationFrameIsFunction);
      testing.expectTrue(result.cancelAnimationFrameIsFunction);
      testing.expectTrue(result.globalPrototypeIsDedicated);
      testing.expectTrue(result.workerPrototypeIsWorker);
      testing.expectTrue(result.eventTargetPrototypeIsNext);
      testing.expectEqual(
        '[object DedicatedWorkerGlobalScope]',
        result.dedicatedTag,
      );
      testing.expectEqual(
        [
          'TEMPORARY',
          'PERSISTENT',
          'constructor',
          'Symbol(Symbol.toStringTag)',
        ],
        result.dedicatedKeys,
      );
      testing.expectEqual(0, result.temporary);
      testing.expectEqual(1, result.persistent);
      testing.expectTrue(result.constantsOnPrototype);
      testing.expectFalse(result.constantsOnGlobal);
      testing.expectTrue(result.postMessageOnGlobal);
      testing.expectFalse(result.postMessageOnDedicatedPrototype);
      testing.expectFalse(result.importScriptsOnGlobal);
      testing.expectTrue(result.importScriptsOnWorkerPrototype);
      testing.expectFalse(result.addEventListenerOnGlobal);
      testing.expectTrue(result.addEventListenerOnEventTargetPrototype);
    });
  }
</script>

<script id="worker_webapi_net" type=module>

      testing.expectEqual(true, r.ac_aborted_after);
      testing.expectEqual(true, r.ac_listener_fired);
      testing.expectEqual('cancelled', r.ac_reason);

      testing.expectEqual(true, r.loc_is_worker_location);
      testing.expectEqual(true, r.loc_identity_stable);
      testing.expectTrue(r.loc_href.endsWith('api-worker.js'));
      testing.expectEqual(r.loc_href, r.loc_to_string);

<script id="worker_navigator" type=module>
  {
    const state = await testing.async();
    const worker = new Worker('./navigator-worker.js');

    worker.onmessage = function(event) {
      state.resolve(event.data);
    };
    const pageHighEntropy = await navigator.userAgentData.getHighEntropyValues([
      'architecture', 'fullVersionList', 'uaFullVersion', 'formFactors',
    ]);
    worker.postMessage({ pageUserAgent: navigator.userAgent });

    await state.done((data) => {
      testing.expectTrue(data.ok, 'worker navigator error: ' + data.err);
      const r = data.results;

      testing.expectEqual(true, r.has_navigator);
      testing.expectEqual('function', r.worker_navigator_type);
      testing.expectEqual('undefined', r.window_navigator_type);
      testing.expectEqual('[object WorkerNavigator]', r.worker_navigator_tag);
      testing.expectEqual('WorkerNavigator', r.worker_navigator_constructor);
      testing.expectTrue(r.worker_navigator_instance);
      testing.expectEqual([
        'hardwareConcurrency',
        'appCodeName',
        'appName',
        'appVersion',
        'platform',
        'product',
        'userAgent',
        'language',
        'languages',
        'onLine',
        'connection',
        'constructor',
        'hid',
        'mediaCapabilities',
        'permissions',
        'serial',
        'usb',
        'deviceMemory',
        'userAgentData',
        'locks',
        'storage',
        'gpu',
        'storageBuckets',
        'Symbol(Symbol.toStringTag)',
      ], r.worker_navigator_prototype_keys);
      testing.expectEqual({
        get: 'function',
        set: 'undefined',
        enumerable: true,
        configurable: true,
        getter_name: 'get userAgent',
        getter_length: 0,
      }, r.user_agent_descriptor);
      testing.expectEqual({
        name: 'TypeError',
        message: 'Illegal invocation',
        ownKeys: ['stack', 'message'],
      }, r.user_agent_illegal_invocation);
      const expectGetterOnlyAssignment = (actual, message) => {
        testing.expectEqual({
          descriptor: {
            get: 'function',
            set: 'undefined',
            enumerable: true,
            configurable: true,
          },
          strictError: { name: 'TypeError', message },
          beforeOwn: false,
          afterStrictOwn: false,
          afterSloppyOwn: false,
          reflectResult: false,
          afterReflectOwn: false,
        }, actual);
      };
      expectGetterOnlyAssignment(
        r.getter_only_worker_navigator,
        'Cannot set property userAgent of #<WorkerNavigator> which has only a getter',
      );
      expectGetterOnlyAssignment(
        r.getter_only_worker_location,
        'Cannot set property href of [object WorkerLocation] which has only a getter',
      );
      expectGetterOnlyAssignment(
        r.getter_only_worker_global,
        'Cannot set property navigator of #<WorkerGlobalScope> which has only a getter',
      );
      testing.expectEqual(true, r.user_agent_matches_page);
      testing.expectEqual('Netscape', r.app_name);
      testing.expectEqual(navigator.appVersion, r.app_version);
      testing.expectTrue(r.platform.length > 0);
      testing.expectEqual(navigator.platform, r.platform);
      testing.expectEqual(navigator.language, r.language);
      testing.expectEqual(navigator.languages, r.languages);
      testing.expectEqual(navigator.hardwareConcurrency, r.hardware_concurrency);
      testing.expectEqual(navigator.deviceMemory, r.device_memory);
      // These are Navigator-only members. Chrome's WorkerNavigator does not
      // inherit the page Navigator surface.
      testing.expectEqual(undefined, r.max_touch_points);
      testing.expectEqual(undefined, r.vendor);
      testing.expectEqual(navigator.product, r.product);
      testing.expectEqual(true, r.on_line);
      testing.expectEqual(true, r.identity_stable);
      testing.expectEqual([], r.instance_keys);

      const expectedCapabilitySurfaces = {
        connection: {
          tag: '[object NetworkInformation]',
          constructor: 'NetworkInformation',
          prototypeKeys: [
            'onchange', 'effectiveType', 'rtt', 'downlink', 'saveData',
            'constructor', 'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'EventTarget',
        },
        hid: {
          tag: '[object HID]',
          constructor: 'HID',
          prototypeKeys: [
            'onconnect', 'ondisconnect', 'getDevices', 'constructor',
            'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'EventTarget',
        },
        mediaCapabilities: {
          tag: '[object MediaCapabilities]',
          constructor: 'MediaCapabilities',
          prototypeKeys: [
            'decodingInfo', 'encodingInfo', 'constructor',
            'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'Object',
        },
        serial: {
          tag: '[object Serial]',
          constructor: 'Serial',
          prototypeKeys: [
            'onconnect', 'ondisconnect', 'getPorts', 'constructor',
            'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'EventTarget',
        },
        usb: {
          tag: '[object USB]',
          constructor: 'USB',
          prototypeKeys: [
            'onconnect', 'ondisconnect', 'getDevices', 'constructor',
            'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'EventTarget',
        },
        locks: {
          tag: '[object LockManager]',
          constructor: 'LockManager',
          prototypeKeys: [
            'query', 'request', 'constructor', 'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'Object',
        },
        gpu: {
          tag: '[object GPU]',
          constructor: 'GPU',
          prototypeKeys: [
            'wgslLanguageFeatures', 'getPreferredCanvasFormat',
            'requestAdapter', 'constructor', 'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'Object',
        },
        storageBuckets: {
          tag: '[object StorageBucketManager]',
          constructor: 'StorageBucketManager',
          prototypeKeys: [
            'delete', 'keys', 'open', 'constructor',
            'Symbol(Symbol.toStringTag)',
          ],
          prototypeParent: 'Object',
        },
      };
      for (const [name, expected] of Object.entries(expectedCapabilitySurfaces)) {
        const actual = r.capabilities[name];
        testing.expectEqual('object', actual.type);
        testing.expectEqual(expected.tag, actual.tag);
        testing.expectEqual(expected.constructor, actual.constructor);
        testing.expectEqual(true, actual.stable);
        testing.expectEqual([], actual.ownKeys);
        testing.expectEqual(expected.prototypeKeys, actual.prototypeKeys);
        testing.expectEqual(expected.prototypeParent, actual.prototypeParent);
        testing.expectEqual({
          get: 'function',
          set: 'undefined',
          enumerable: true,
          configurable: true,
          getterName: 'get ' + name,
          getterLength: 0,
        }, actual.descriptor);
      }
      for (const type of Object.values(r.capability_constructor_types)) {
        testing.expectEqual('function', type);
      }
      testing.expectEqual({
        effectiveType: '4g',
        rtt: 100,
        downlink: 10,
        saveData: false,
        handlerStable: true,
        eventTarget: true,
      }, r.capability_results.connection);
      testing.expectEqual([], r.capability_results.hidDevices);
      testing.expectEqual([], r.capability_results.serialPorts);
      testing.expectEqual([], r.capability_results.usbDevices);
      testing.expectEqual({ held: [], pending: [] }, r.capability_results.lockSnapshot);
      testing.expectEqual([], r.capability_results.bucketKeys);
      testing.expectEqual('bgra8unorm', r.capability_results.preferredCanvasFormat);
      testing.expectEqual(null, r.capability_results.gpuAdapter);
      testing.expectEqual(true, r.capability_results.wgslFeaturesStable);

      // Permissions (transitive: Permissions -> PermissionStatus)
      testing.expectEqual('geolocation', r.permission_name);
      testing.expectEqual('prompt', r.permission_state);

      // StorageManager (transitive: StorageManager -> StorageEstimate)
      testing.expectEqual(0, r.storage_usage);
      testing.expectTrue(r.storage_quota > 0);

      // NavigatorUAData
      testing.expectEqual(true, r.has_ua_data);
      testing.expectEqual(navigator.userAgentData.brands, r.ua_brands);
      testing.expectEqual(navigator.userAgentData.mobile, r.ua_mobile);
      testing.expectEqual(navigator.userAgentData.platform, r.ua_platform);
      testing.expectEqual(pageHighEntropy.architecture, r.ua_high_entropy_arch);
      testing.expectEqual(pageHighEntropy.uaFullVersion, r.ua_full_version);
      testing.expectEqual(pageHighEntropy.fullVersionList, r.ua_full_version_list);
      testing.expectEqual(pageHighEntropy.formFactors, r.ua_form_factors);

      // [Exposed=Window] members aren't part of WorkerNavigator.
      testing.expectEqual(true, r.no_plugins);
      testing.expectEqual(true, r.no_register_protocol_handler);
      testing.expectEqual(true, r.no_model_context);
      testing.expectEqual(true, r.no_vendor);
      testing.expectEqual(true, r.no_vendor_sub);
      testing.expectEqual(true, r.no_product_sub);
      testing.expectEqual(true, r.no_max_touch_points);
      testing.expectEqual(true, r.no_cookie_enabled);
      testing.expectEqual(true, r.no_webdriver);
      testing.expectEqual(true, r.no_java_enabled);
    });
  }
</script>

<script id="fetch_deferred_behind_importScripts" type=module>
  // A worker fetch() whose response arrives during a blocking importScripts()
  // is deferred by the DeferringLayer; the worker must flush it (it has no
  // ScriptManager). Without the flush the fetch never resolves and its
  // Response arena leaks (caught by the runner's ArenaPool leak check).
  {
    const state = await testing.async();
    const worker = new Worker('fetch-defer-worker.js');
    worker.onmessage = (event) => state.resolve(event.data);
    worker.postMessage(null);

    await state.done((data) => {
      testing.expectTrue(data.ok, 'worker fetch failed: ' + data.err);
      testing.expectEqual(200, data.status);
    });
  }
</script>

<script id="worker_post_before_load" type=module>
  // Per spec, messages posted before the worker has finished loading must
  // be buffered and delivered once onmessage is registered. Without the
  // pending-message queue this hangs: postMessage fires immediately after
  // new Worker, while the worker script's HTTP fetch is still in flight,
  // so by the time the worker dispatches the message there is no
  // onmessage listener yet and the message gets silently dropped.
  {
    const state = await testing.async();
    const worker = new Worker('./echo-worker.js');
    worker.onmessage = function(event) {
      state.resolve(event.data);
    };
    // No setTimeout — post right now while the script is still loading.
    worker.postMessage({ greeting: 'before-load' });

    await state.done((response) => {
      testing.expectEqual('before-load', response.echo.greeting);
      testing.expectEqual('worker', response.from);
    });
  }
</script>

<script id="worker_module_type" type=module>
  // A module-type worker: its entry script uses top-level static import (only
  // valid in module workers), and importScripts() throws a TypeError.
  {
    const state = await testing.async();
    const worker = new Worker('./module-worker.js', { type: 'module' });

    worker.onmessage = function(event) {
      state.resolve(event.data);
    };
    worker.postMessage({ greeting: 'to-module' });

    await state.done((response) => {
      testing.expectEqual('to-module', response.echo.greeting);
      testing.expectEqual('module-worker', response.from);
      testing.expectEqual('from-base', response.baseValue);
      testing.expectEqual('from-base', response.importedValue);
      testing.expectEqual('local', response.localValue);
      testing.expectEqual('TypeError', response.importScriptsError);
    });
  }
</script>

<script id="worker_from_blob_url" type=module>
  // A blob: worker resolves its initial script through the HTTP client's
  // synthetic-scheme path against the Page's blob registry, like any URL.
  {
    const state = await testing.async();
    const blob = new Blob(["onmessage = (e) => postMessage({ echo: e.data, from: 'blob-worker' });"], { type: 'text/javascript' });
    const blobUrl = URL.createObjectURL(blob);
    const worker = new Worker(blobUrl);

    worker.onmessage = function(event) {
      state.resolve(event.data);
    };
    worker.postMessage({ greeting: 'from-blob' });

    await state.done((response) => {
      testing.expectEqual('from-blob', response.echo.greeting);
      testing.expectEqual('blob-worker', response.from);
      URL.revokeObjectURL(blobUrl);
    });
  }
</script>

<script id="worker_from_immediately_revoked_blob_url" type=module>
  // Chromium resolves a BlobURLToken during Worker construction. The public
  // URL can be revoked before the asynchronous script fetch without breaking
  // the already-started Worker load.
  {
    const state = await testing.async();
    const blob = new Blob(["postMessage('immediate-revoke-blob-worker');"], { type: 'text/javascript' });
    const blobUrl = URL.createObjectURL(blob);
    const worker = new Worker(blobUrl);
    URL.revokeObjectURL(blobUrl);

    worker.onerror = (event) => {
      state.resolve({ ok: false, error: event.message || 'worker error' });
    };
    worker.onmessage = (event) => {
      state.resolve({ ok: true, value: event.data });
    };

    await state.done((result) => {
      testing.expectTrue(result.ok, 'immediate-revoke blob worker error: ' + result.error);
      testing.expectEqual('immediate-revoke-blob-worker', result.value);
    });
    worker.terminate();
  }
</script>

<script id="worker_from_cross_global_blob_url" type=module>
  // Object URLs are resolvable by other globals in the same agent cluster.
  // Create one inside a DedicatedWorker, pass it to the Window, and use it as
  // another Worker's entry script.
  {
    const state = await testing.async();
    const creator = new Worker('./cross-global-blob-url-worker.js');
    let consumer;
    let blobUrl;

    creator.onerror = (event) => {
      state.resolve({ ok: false, error: event.message || 'creator error' });
    };
    creator.onmessage = function(event) {
      blobUrl = event.data;
      consumer = new Worker(blobUrl);
      URL.revokeObjectURL(blobUrl);
      consumer.onerror = (errorEvent) => {
        state.resolve({ ok: false, error: errorEvent.message || 'consumer error' });
      };
      consumer.onmessage = (messageEvent) => {
        state.resolve({ ok: true, value: messageEvent.data });
      };
    };

    await state.done((result) => {
      testing.expectTrue(result.ok, 'cross-global blob worker error: ' + result.error);
      testing.expectEqual('cross-global-blob-worker', result.value);
    });

    if (blobUrl) {
      let revoked = false;
      try {
        await fetch(blobUrl);
      } catch {
        revoked = true;
      }
      testing.expectTrue(revoked);
    }
    if (consumer) consumer.terminate();
    creator.terminate();
  }
</script>
