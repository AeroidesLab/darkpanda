<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=WebGLRenderingContext#getSupportedExtensions>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);

  const supportedExtensions = ctx.getSupportedExtensions();
  // The order Chrome prefer.
  const expectedExtensions = [
      "ANGLE_instanced_arrays",
      "EXT_blend_minmax",
      "EXT_clip_control",
      "EXT_color_buffer_half_float",
      "EXT_depth_clamp",
      "EXT_disjoint_timer_query",
      "EXT_float_blend",
      "EXT_frag_depth",
      "EXT_polygon_offset_clamp",
      "EXT_shader_texture_lod",
      "EXT_texture_compression_bptc",
      "EXT_texture_compression_rgtc",
      "EXT_texture_filter_anisotropic",
      "EXT_texture_mirror_clamp_to_edge",
      "EXT_sRGB",
      "KHR_parallel_shader_compile",
      "OES_element_index_uint",
      "OES_fbo_render_mipmap",
      "OES_standard_derivatives",
      "OES_texture_float",
      "OES_texture_float_linear",
      "OES_texture_half_float",
      "OES_texture_half_float_linear",
      "OES_vertex_array_object",
      "WEBGL_blend_func_extended",
      "WEBGL_color_buffer_float",
      "WEBGL_compressed_texture_astc",
      "WEBGL_compressed_texture_etc",
      "WEBGL_compressed_texture_etc1",
      "WEBGL_compressed_texture_pvrtc",
      "WEBGL_compressed_texture_s3tc",
      "WEBGL_compressed_texture_s3tc_srgb",
      "WEBGL_debug_renderer_info",
      "WEBGL_debug_shaders",
      "WEBGL_depth_texture",
      "WEBGL_draw_buffers",
      "WEBGL_lose_context",
      "WEBGL_multi_draw",
      "WEBGL_polygon_mode"
  ];

  testing.expectEqual(expectedExtensions.length, supportedExtensions.length);
  for (let i = 0; i < expectedExtensions.length; i++) {
    testing.expectEqual(expectedExtensions[i], supportedExtensions[i]);
  }
}
</script>

<script id=WebGLRenderingCanvas#getExtension>
// WEBGL_debug_renderer_info
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const rendererInfo = ctx.getExtension("WEBGL_debug_renderer_info");
  testing.expectTrue(rendererInfo !== null);

  const { UNMASKED_VENDOR_WEBGL, UNMASKED_RENDERER_WEBGL } = rendererInfo;
  testing.expectEqual(UNMASKED_VENDOR_WEBGL, 0x9245);
  testing.expectEqual(UNMASKED_RENDERER_WEBGL, 0x9246);

  testing.expectEqual("Google Inc. (Google)", ctx.getParameter(UNMASKED_VENDOR_WEBGL));
  testing.expectEqual(
    "ANGLE (Intel, Intel(R) UHD Graphics 630 Direct3D11 vs_5_0 ps_5_0, D3D11)",
    ctx.getParameter(UNMASKED_RENDERER_WEBGL),
  );
}

// WEBGL_lose_context
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const loseContext = ctx.getExtension("WEBGL_lose_context");
  testing.expectTrue(loseContext !== null);

  loseContext.loseContext();
  loseContext.restoreContext();
}
</script>

<script id=fingerprint-surface>
{
  const canvas = new OffscreenCanvas(256, 256);
  const gl = canvas.getContext('webgl');
  const gl2 = new OffscreenCanvas(256, 256).getContext('webgl2');

  testing.expectTrue(gl instanceof WebGLRenderingContext);
  testing.expectTrue(gl2 instanceof WebGLRenderingContext);
  testing.expectEqual(256, gl.drawingBufferWidth);
  testing.expectEqual(256, gl.drawingBufferHeight);
  testing.expectEqual(true, gl.getContextAttributes().antialias);
  testing.expectEqual([16384, 16384], Array.from(gl.getParameter(gl.MAX_VIEWPORT_DIMS)));

  const program = gl.createProgram();
  const shader = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(shader, 'void main() {}');
  gl.compileShader(shader);
  gl.attachShader(program, shader);
  gl.linkProgram(program);
  gl.useProgram(program);
  gl.drawArrays(gl.LINE_LOOP, 0, 3);

  const pixels = new Uint8Array(16);
  gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  testing.expectEqual(
    [17, 46, 75, 104, 133, 162, 191, 220, 249, 27, 56, 85, 114, 143, 172, 201],
    Array.from(pixels),
  );

  const highFloat = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  testing.expectEqual({precision: 23, rangeMax: 127, rangeMin: 127}, highFloat);
}
</script>

<script id=identity>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('webgl');

  testing.expectTrue(ctx === element.getContext('webgl'));
  testing.expectEqual(null, element.getContext('2d'));
}
</script>

<script id=worker-webgl type=module>
{
  const state = await testing.async();
  const worker = new Worker('./webgl-worker.js');
  worker.onmessage = event => state.resolve(event.data);
  await state.done(data => {
    testing.expectTrue(data.ok, data.error);
    testing.expectEqual('Google Inc. (Google)', data.vendor);
    testing.expectEqual(8, data.width);
  });
}
</script>
