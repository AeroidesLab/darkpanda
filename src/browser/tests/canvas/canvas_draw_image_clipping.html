<!DOCTYPE html>
<script src="../testing.js"></script>

<script id="Canvas drawImage source rectangle normalization and clipping">
{
  function makeSource(offscreen = false) {
    const source = offscreen ? new OffscreenCanvas(4, 2) : document.createElement('canvas');
    source.width = 4;
    source.height = 2;
    const ctx = source.getContext('2d');
    for (const [color, x, y] of [
      ['red', 0, 0],
      ['lime', 1, 0],
      ['blue', 2, 0],
      ['yellow', 3, 0],
      ['cyan', 0, 1],
      ['magenta', 1, 1],
      ['black', 2, 1],
      ['white', 3, 1],
    ]) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }
    return source;
  }

  function render(width, height, draw, offscreen = false, smoothing = false) {
    const destination = offscreen
      ? new OffscreenCanvas(width, height)
      : document.createElement('canvas');
    destination.width = width;
    destination.height = height;
    const ctx = destination.getContext('2d');
    ctx.imageSmoothingEnabled = smoothing;
    draw(ctx);
    return Array.from(ctx.getImageData(0, 0, width, height).data);
  }

  const transparent = [0, 0, 0, 0];
  const red = [255, 0, 0, 255];
  const green = [0, 255, 0, 255];
  const blue = [0, 0, 255, 255];
  const yellow = [255, 255, 0, 255];
  const cyan = [0, 255, 255, 255];
  const htmlSource = makeSource();
  const offscreenSource = makeSource(true);

  testing.expectEqual(
    [...green, ...blue],
    render(2, 1, ctx => {
      ctx.drawImage(htmlSource, 3, 0, -2, 1, 0, 0, 2, 1);
    }),
  );
  testing.expectEqual(
    [...red, ...cyan],
    render(1, 2, ctx => {
      ctx.drawImage(htmlSource, 0, 2, 1, -2, 0, 0, 1, 2);
    }),
  );
  testing.expectEqual(
    [...transparent, ...red, ...green],
    render(3, 1, ctx => {
      ctx.drawImage(htmlSource, -1, 0, 3, 1, 0, 0, 3, 1);
    }),
  );
  testing.expectEqual(
    [...yellow, ...transparent, ...transparent],
    render(3, 1, ctx => {
      ctx.drawImage(htmlSource, 3, 0, 3, 1, 0, 0, 3, 1);
    }),
  );
  testing.expectEqual(
    [...transparent, ...transparent, ...red, ...red, ...green, ...green],
    render(6, 1, ctx => {
      ctx.drawImage(htmlSource, -1, 0, 3, 1, 0, 0, 6, 1);
    }),
  );
  testing.expectEqual(
    [...yellow, ...yellow, ...transparent, ...transparent, ...transparent, ...transparent],
    render(6, 1, ctx => {
      ctx.drawImage(htmlSource, 3, 0, 3, 1, 0, 0, 6, 1);
    }),
  );
  testing.expectEqual(
    [...red, ...green, ...green, ...blue],
    render(4, 1, ctx => {
      ctx.drawImage(htmlSource, 0.5, 0, 2, 1, 0, 0, 4, 1);
    }),
  );
  testing.expectEqual(
    [...transparent, ...red, ...red, ...green],
    render(4, 1, ctx => {
      ctx.drawImage(htmlSource, -0.5, 0, 2, 1, 0, 0, 4, 1);
    }),
  );
  testing.expectEqual(
    [
      95, 159, 0, 255,
      31, 223, 0, 255,
      0, 223, 31, 255,
      0, 159, 95, 255,
      0, 95, 159, 255,
      0, 31, 223, 255,
      31, 31, 223, 255,
      95, 95, 159, 255,
    ],
    render(8, 1, ctx => {
      ctx.drawImage(htmlSource, 1, 0, 2, 1, 0, 0, 8, 1);
    }, false, true),
  );
  testing.expectEqual(
    [
      ...transparent,
      ...transparent,
      ...red,
      191, 63, 0, 255,
      63, 191, 0, 255,
      0, 191, 63, 255,
    ],
    render(6, 1, ctx => {
      ctx.drawImage(htmlSource, -1, 0, 3, 1, 0, 0, 6, 1);
    }, false, true),
  );
  testing.expectEqual(
    [...transparent, ...red, ...cyan],
    render(1, 3, ctx => {
      ctx.drawImage(htmlSource, 0, -1, 1, 3, 0, 0, 1, 3);
    }),
  );
  testing.expectEqual(
    [...cyan, ...transparent, ...transparent],
    render(1, 3, ctx => {
      ctx.drawImage(htmlSource, 0, 1, 1, 3, 0, 0, 1, 3);
    }),
  );
  testing.expectEqual(
    [...transparent, ...transparent, ...red],
    render(3, 1, ctx => {
      ctx.drawImage(htmlSource, 1, 0, -3, 1, 0, 0, 3, 1);
    }),
  );
  testing.expectEqual(
    [
      17, 34, 51, 255,
      17, 34, 51, 255,
      17, 34, 51, 255,
    ],
    render(3, 1, ctx => {
      ctx.fillStyle = 'rgb(17, 34, 51)';
      ctx.fillRect(0, 0, 3, 1);
      ctx.drawImage(htmlSource, 9, 0, 2, 1, 0, 0, 2, 1);
      ctx.drawImage(htmlSource, -9, 0, 2, 1, 1, 0, 2, 1);
    }),
  );
  testing.expectEqual(
    [...red, ...green],
    render(2, 1, ctx => {
      ctx.drawImage(htmlSource, 0, 0, 2, 1, 2, 0, -2, 1);
    }),
  );
  testing.expectEqual(
    [...transparent, ...red, ...green],
    render(3, 1, ctx => {
      ctx.drawImage(offscreenSource, -1, 0, 3, 1, 0, 0, 3, 1);
    }),
  );
  testing.expectEqual(
    [...yellow, ...transparent, ...transparent],
    render(3, 1, ctx => {
      ctx.drawImage(htmlSource, 3, 0, 3, 1, 0, 0, 3, 1);
    }, true),
  );
}
</script>
