<!doctype html>
<head>
<script src="../testing.js"></script>
</head>
<body>
<div id="target"></div>
<script id="trusted-types-default-missing">
testing.onload(() => {
  let creationError = null;
  try {
    trustedTypes.createPolicy('default', { createScript: input => input });
  } catch (error) {
    creationError = `${error.name}: ${error.message}`;
  }
  testing.expectEqual(null, creationError);
  let error = null;
  try { document.getElementById('target').innerHTML = 'blocked'; } catch (caught) { error = caught; }
  testing.expectEqual('TypeError', error && error.name);
  testing.expectEqual(
    "Failed to set the 'innerHTML' property on 'Element': This document requires 'TrustedHTML' assignment and no 'default' policy for 'TrustedHTML' has been defined.",
    error && error.message,
  );
});
</script>
</body>
