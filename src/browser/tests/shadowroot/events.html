<!DOCTYPE html>
<script src="../testing.js"></script>
<body></body>

<script id="event_bubbling_through_shadow">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<button id="btn">Click</button>';
    document.body.appendChild(host);

    const button = shadow.getElementById('btn');

    let insideCalled = false;
    let shadowCalled = false;
    let hostCalled = false;
    let documentCalled = false;

    let insideTarget = null;
    let hostTarget = null;

    button.addEventListener('click', (e) => {
        insideCalled = true;
        insideTarget = e.target;
    });

    shadow.addEventListener('click', (e) => {
        shadowCalled = true;
    });

    host.addEventListener('click', (e) => {
        hostCalled = true;
        hostTarget = e.target;
    });

    document.addEventListener('click', (e) => {
        documentCalled = true;
    });

    const event = new Event('click', { bubbles: true });
    button.dispatchEvent(event);

    testing.expectEqual(true, insideCalled);
    testing.expectEqual(true, shadowCalled);

    // Without composed:true, event should NOT escape shadow tree
    testing.expectEqual(false, hostCalled);
    testing.expectEqual(false, documentCalled);

    host.remove();
}
</script>

<script id="event_composed_escapes_shadow">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<button id="btn">Click</button>';
    document.body.appendChild(host);

    const button = shadow.getElementById('btn');

    let hostCalled = false;
    let hostTarget = null;

    host.addEventListener('click', (e) => {
        hostCalled = true;
        hostTarget = e.target;
    });

    // With composed:true, event SHOULD escape shadow tree
    const event = new Event('click', { bubbles: true, composed: true });
    button.dispatchEvent(event);

    testing.expectEqual(true, hostCalled);

    // Event target should be retargeted to host when outside shadow tree
    testing.expectEqual(host, hostTarget);

    host.remove();
}
</script>

<script id="composedPath_basic">
{
    const div1 = document.createElement('div');
    const div2 = document.createElement('div');
    const button = document.createElement('button');

    div1.appendChild(div2);
    div2.appendChild(button);
    document.body.appendChild(div1);

    let capturedPath = null;

    button.addEventListener('click', (e) => {
        capturedPath = e.composedPath();
    });

    const event = new Event('click', { bubbles: true });
    button.dispatchEvent(event);

    testing.expectEqual(7, capturedPath.length);
    testing.expectEqual(button, capturedPath[0]);
    testing.expectEqual(div2, capturedPath[1]);
    testing.expectEqual(div1, capturedPath[2]);
    testing.expectEqual(document.body, capturedPath[3]);
    testing.expectEqual(document.documentElement, capturedPath[4]);
    testing.expectEqual(document, capturedPath[5]);
    testing.expectEqual(window, capturedPath[6]);

    div1.remove();
}
</script>

<script id="composedPath_after_dispatch">
{
    const button = document.createElement('button');
    document.body.appendChild(button);

    const event = new Event('click', { bubbles: true });
    button.dispatchEvent(event);

    const path = event.composedPath();
    testing.expectEqual(0, path.length);

    button.remove();
}
</script>

<script id="composedPath_open_shadow_from_host">
{
    // Test that open shadow root exposes internals in composedPath
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    const button = document.createElement('button');

    shadow.appendChild(button);
    document.body.appendChild(host);

    let capturedPath = null;

    host.addEventListener('click', (e) => {
        capturedPath = e.composedPath();
    });

    const event = new Event('click', { bubbles: true, composed: true });
    button.dispatchEvent(event);

    // Open shadow: external listener should see shadow internals
    testing.expectEqual(7, capturedPath.length);
    testing.expectEqual(button, capturedPath[0]);
    testing.expectEqual(shadow, capturedPath[1]);
    testing.expectEqual(host, capturedPath[2]);
    testing.expectEqual(document.body, capturedPath[3]);
    testing.expectEqual(document.documentElement, capturedPath[4]);
    testing.expectEqual(document, capturedPath[5]);
    testing.expectEqual(window, capturedPath[6]);

}
</script>

<script id="composedPath_closed_shadow_from_host">
{
    // Test that closed shadow root hides internals in composedPath
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'closed' });
    const button = document.createElement('button');

    shadow.appendChild(button);
    document.body.appendChild(host);

    let capturedPath = null;

        capturedPath = e.composedPath();
    });

    const event = new Event('click', { bubbles: true, composed: true });
    button.dispatchEvent(event);

    // Closed shadow: external listener should NOT see shadow internals
    testing.expectEqual(5, capturedPath.length);

    testing.expectEqual(document.documentElement, capturedPath[2]);
    testing.expectEqual(document, capturedPath[3]);
    testing.expectEqual(window, capturedPath[4]);

    host.remove();
}
</script>

<script id="composedPath_nested_closed_shadow_visibility">
{
    const outerHost = document.createElement('div');
    const outerShadow = outerHost.attachShadow({ mode: 'closed' });
    const outerListener = document.createElement('section');
    const innerHost = document.createElement('div');
    const innerShadow = innerHost.attachShadow({ mode: 'closed' });
    const target = document.createElement('button');

    innerShadow.appendChild(target);
    outerListener.appendChild(innerHost);
    outerShadow.appendChild(outerListener);
    document.body.appendChild(outerHost);

    let outerPath = null;
    let documentPath = null;
    outerListener.addEventListener('nested-closed', event => {
        outerPath = event.composedPath();
    });
    document.addEventListener('nested-closed', event => {
        documentPath = event.composedPath();
    }, { once: true });

    target.dispatchEvent(new Event('nested-closed', { bubbles: true, composed: true }));

    // A listener inside the outer closed root sees that tree, but the inner
    // root remains opaque and begins at its host.
    testing.expectEqual(8, outerPath.length);
    testing.expectEqual(innerHost, outerPath[0]);
    testing.expectEqual(outerListener, outerPath[1]);
    testing.expectEqual(outerShadow, outerPath[2]);
    testing.expectEqual(outerHost, outerPath[3]);
    testing.expectEqual(document.body, outerPath[4]);
    testing.expectEqual(document.documentElement, outerPath[5]);
    testing.expectEqual(document, outerPath[6]);
    testing.expectEqual(window, outerPath[7]);

    // A listener outside both roots sees neither set of internals.
    testing.expectEqual(5, documentPath.length);
    testing.expectEqual(outerHost, documentPath[0]);
    testing.expectEqual(document.body, documentPath[1]);
    testing.expectEqual(document.documentElement, documentPath[2]);
    testing.expectEqual(document, documentPath[3]);
    testing.expectEqual(window, documentPath[4]);

    outerHost.remove();
}
</script>

<script id="composedPath_detached_tree_excludes_window">
{
    // A detached tree's path ends at its root: no document, no window.
    const root = document.createElement('div');
    const target = document.createElement('span');
    root.appendChild(target);

    let capturedPath = null;
    root.addEventListener('my-event', (e) => {
        capturedPath = e.composedPath();
    });
    target.dispatchEvent(new Event('my-event', { bubbles: true, composed: true }));

    testing.expectEqual(2, capturedPath.length);
    testing.expectEqual(target, capturedPath[0]);
    testing.expectEqual(root, capturedPath[1]);
}
</script>

<script id="dispatch_path_is_snapshotted_before_listener_mutation">
{
    const host = document.createElement('div');
    const root = host.attachShadow({ mode: 'closed' });
    const target = document.createElement('button');
    root.appendChild(target);
    document.body.appendChild(host);

    const invoked = [];
    let insidePath = null;
    let outsidePath = null;

    target.addEventListener('snapshot-mutation', event => {
        invoked.push('target');
        // Move the target across both the shadow and document-tree boundary.
        // The in-flight EventPath and its closed-root visibility stay frozen.
        document.body.appendChild(target);
        insidePath = event.composedPath();
    });
    root.addEventListener('snapshot-mutation', () => invoked.push('root'));
    host.addEventListener('snapshot-mutation', () => invoked.push('host'));
    document.addEventListener('snapshot-mutation', event => {
        invoked.push('document');
        outsidePath = event.composedPath();
    }, { once: true });

    target.dispatchEvent(new Event('snapshot-mutation', {
        bubbles: true,
        composed: true,
    }));

    testing.expectEqual('target,root,host,document', invoked.join(','));
    testing.expectEqual(7, insidePath.length);
    testing.expectEqual(target, insidePath[0]);
    testing.expectEqual(root, insidePath[1]);
    testing.expectEqual(host, insidePath[2]);
    testing.expectEqual(document.body, insidePath[3]);
    testing.expectEqual(document.documentElement, insidePath[4]);
    testing.expectEqual(document, insidePath[5]);
    testing.expectEqual(window, insidePath[6]);

    // The target and closed ShadowRoot remain hidden from an outside listener
    // even though the target is physically in document.body by this point.
    testing.expectEqual(5, outsidePath.length);
    testing.expectEqual(host, outsidePath[0]);
    testing.expectEqual(document.body, outsidePath[1]);
    testing.expectEqual(document.documentElement, outsidePath[2]);
    testing.expectEqual(document, outsidePath[3]);
    testing.expectEqual(window, outsidePath[4]);

    target.remove();
    host.remove();
}
</script>

<script id="relatedTarget_is_retargeted_and_shrinks_shadow_sibling_path">
{
    const host = document.createElement('div');
    const root = host.attachShadow({ mode: 'open' });
    const target = document.createElement('span');
    const sibling = document.createElement('span');
    root.append(target, sibling);
    document.body.appendChild(host);

    const seen = [];
    let targetPath = null;
    let rootPath = null;
    target.addEventListener('mouseover', event => {
        seen.push('target');
        testing.expectEqual(target, event.target);
        testing.expectEqual(sibling, event.relatedTarget);
        targetPath = event.composedPath();
    });
    root.addEventListener('mouseover', event => {
        seen.push('root');
        testing.expectEqual(target, event.target);
        testing.expectEqual(sibling, event.relatedTarget);
        rootPath = event.composedPath();
    });
    host.addEventListener('mouseover', () => seen.push('host'));
    const documentListener = () => seen.push('document');
    document.addEventListener('mouseover', documentListener);

    const event = new MouseEvent('mouseover', {
        bubbles: true,
        composed: true,
        relatedTarget: sibling,
    });
    target.dispatchEvent(event);

    testing.expectEqual('target,root', seen.join(','));
    for (const path of [targetPath, rootPath]) {
        testing.expectEqual(2, path.length);
        testing.expectEqual(target, path[0]);
        testing.expectEqual(root, path[1]);
    }
    testing.expectEqual(null, event.target);
    testing.expectEqual(null, event.relatedTarget);

    document.removeEventListener('mouseover', documentListener);
    host.remove();
}
</script>

<script id="dispatch_path_has_no_fixed_128_entry_limit">
{
    const outer = document.createElement('div');
    document.body.appendChild(outer);
    let target = outer;
    for (let i = 1; i < 140; ++i) {
        const child = document.createElement('div');
        target.appendChild(child);
        target = child;
    }

    let path = null;
    target.addEventListener('deep-path', event => {
        path = event.composedPath();
    });
    target.dispatchEvent(new Event('deep-path', { bubbles: true }));

    testing.expectEqual(144, path.length);
    testing.expectEqual(target, path[0]);
    testing.expectEqual(outer, path[139]);
    testing.expectEqual(document.body, path[140]);
    testing.expectEqual(document.documentElement, path[141]);
    testing.expectEqual(document, path[142]);
    testing.expectEqual(window, path[143]);
    outer.remove();
}
</script>

<script id="post_dispatch_state">
{
    const host = document.createElement('div');
    document.body.appendChild(host);
    const shadow = host.attachShadow({ mode: 'open' });
    const target = document.createElement('span');
    shadow.appendChild(target);
    shadow.addEventListener('my-event', () => {});

    // composed: crossing the boundary retargets to the host post-dispatch.
    const composed = new Event('my-event', { bubbles: true, composed: true });
    target.dispatchEvent(composed);
    testing.expectEqual(host, composed.target);
    testing.expectEqual(null, composed.currentTarget);
    testing.expectEqual(0, composed.eventPhase);
    testing.expectEqual(0, composed.composedPath().length);

    // non-composed: the event never left the shadow tree, targets are cleared.
    const scoped = new Event('my-event', { bubbles: true, composed: false });
    target.dispatchEvent(scoped);
    testing.expectEqual(null, scoped.target);

    host.remove();
}
</script>
