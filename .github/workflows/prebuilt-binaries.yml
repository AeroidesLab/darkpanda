name: build

on:
  workflow_dispatch:
    inputs:
      dependency_cache_generation:
        description: Change only to invalidate verified immutable caches
        required: true
        default: v1
        type: string
      publish_release:
        description: Publish the verified Windows/Linux/macOS archives as a prerelease
        required: true
        default: false
        type: boolean
      fingerprint_source_run_id:
        description: Reuse Windows artifacts from this run and execute only fingerprint verification
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: darkpanda-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: "0"
  DEPOT_TOOLS_UPDATE: "0"
  CACHE_GENERATION: ${{ inputs.dependency_cache_generation || 'v1' }}
  MATURIN_VERSION: "1.9.6"
  PYTEST_VERSION: "8.4.1"

jobs:
  prepare:
    name: prepare
    if: inputs.fingerprint_source_run_id == ''
    runs-on: ubuntu-24.04
    outputs:
      canvas_revision: ${{ steps.resolve.outputs.canvas_revision }}
      html5ever_revision: ${{ steps.resolve.outputs.html5ever_revision }}
      wreq_revision: ${{ steps.resolve.outputs.wreq_revision }}
      boringssl_revision: ${{ steps.resolve.outputs.boringssl_revision }}
      py_darkpanda_revision: ${{ steps.resolve.outputs.py_darkpanda_revision }}
      chrome_version: ${{ steps.resolve.outputs.chrome_version }}
      chromium_revision: ${{ steps.resolve.outputs.chromium_revision }}
      skia_revision: ${{ steps.resolve.outputs.skia_revision }}
      profile_sha256: ${{ steps.resolve.outputs.profile_sha256 }}
      zig_version: ${{ steps.resolve.outputs.zig_version }}
      zig_windows_sha256: ${{ steps.resolve.outputs.zig_windows_sha256 }}
      zig_linux_sha256: ${{ steps.resolve.outputs.zig_linux_sha256 }}
      zig_macos_x86_64_sha256: ${{ steps.resolve.outputs.zig_macos_x86_64_sha256 }}
      zig_macos_aarch64_sha256: ${{ steps.resolve.outputs.zig_macos_aarch64_sha256 }}
      v8_version: ${{ steps.resolve.outputs.v8_version }}
      v8_revision: ${{ steps.resolve.outputs.v8_revision }}
      zig_v8_revision: ${{ steps.resolve.outputs.zig_v8_revision }}
    steps:
      - name: Check out the browser build authority
        id: checkout_browser_authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: browser
          persist-credentials: false

      - name: Check out latest Canvas source
        id: checkout_canvas
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/canvas
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: components/canvas
          persist-credentials: false

      - name: Check out latest HTML5ever source
        id: checkout_html5ever
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/html5ever
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: components/html5ever
          persist-credentials: false

      - name: Check out latest wreq source
        id: checkout_wreq
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/wreq
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: components/wreq
          persist-credentials: false

      - name: Check out latest BoringSSL source
        id: checkout_boringssl
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/boringssl
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: components/boringssl
          persist-credentials: false

      - name: Check out latest PyO3 binding source
        id: checkout_py_darkpanda
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/py-darkpanda
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: components/py-darkpanda
          persist-credentials: false

      - name: Resolve the immutable inputs for this run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          profile=browser/tools/ci/chromium-profile.json
          jq -e '
            .schema == "darkpanda-chromium-profile/v1" and
            .policy.browser == "fixed" and
            .policy.components == "latest-main-at-build-start" and
            .darkpanda_build.v8.zig_v8_repository == "AeroidesLab/zig-v8-fork" and
            .darkpanda_build.v8.build_mode == "source"
          ' "$profile" >/dev/null

          canvas_revision=$(git -C components/canvas rev-parse HEAD)
          html5ever_revision=$(git -C components/html5ever rev-parse HEAD)
          wreq_revision=$(git -C components/wreq rev-parse HEAD)
          boringssl_revision=$(git -C components/boringssl rev-parse HEAD)
          py_darkpanda_revision=$(git -C components/py-darkpanda rev-parse HEAD)
          chrome_version=$(jq -r .google_chrome_stable.version "$profile")
          chromium_revision=$(jq -r .chromium_revision "$profile")
          skia_revision=$(jq -r .skia_revision "$profile")
          zig_version=$(jq -r .darkpanda_build.zig.version "$profile")
          zig_windows_sha256=$(jq -r '.darkpanda_build.zig.sha256["windows-x86_64"]' "$profile")
          zig_linux_sha256=$(jq -r '.darkpanda_build.zig.sha256["linux-x86_64"]' "$profile")
          zig_macos_x86_64_sha256=$(jq -r '.darkpanda_build.zig.sha256["macos-x86_64"]' "$profile")
          zig_macos_aarch64_sha256=$(jq -r '.darkpanda_build.zig.sha256["macos-aarch64"]' "$profile")
          v8_version=$(jq -r .darkpanda_build.v8.version "$profile")
          v8_revision=$(jq -r .darkpanda_build.v8.revision "$profile")
          zig_v8_revision=$(jq -r .darkpanda_build.v8.zig_v8_revision "$profile")
          profile_sha256=$(sha256sum "$profile" | cut -d' ' -f1)

          for revision in \
            "$canvas_revision" \
            "$html5ever_revision" \
            "$wreq_revision" \
            "$boringssl_revision" \
            "$py_darkpanda_revision" \
            "$chromium_revision" \
            "$skia_revision" \
            "$v8_revision" \
            "$zig_v8_revision"; do
            [[ $revision =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Invalid resolved Git revision: $revision"
              exit 1
            }
          done
          [[ $zig_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $v8_version =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          zon_zig_version=$(
            sed -n 's/^[[:space:]]*\.minimum_zig_version = "\([^"]*\)".*/\1/p' \
              browser/build.zig.zon
          )
          test "$zon_zig_version" = "$zig_version"
          for digest in \
            "$zig_windows_sha256" \
            "$zig_linux_sha256" \
            "$zig_macos_x86_64_sha256" \
            "$zig_macos_aarch64_sha256"; do
            [[ $digest =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid Zig archive SHA-256: $digest"
              exit 1
            }
          done

          {
            echo "canvas_revision=$canvas_revision"
            echo "html5ever_revision=$html5ever_revision"
            echo "wreq_revision=$wreq_revision"
            echo "boringssl_revision=$boringssl_revision"
            echo "py_darkpanda_revision=$py_darkpanda_revision"
            echo "chrome_version=$chrome_version"
            echo "chromium_revision=$chromium_revision"
            echo "skia_revision=$skia_revision"
            echo "profile_sha256=$profile_sha256"
            echo "zig_version=$zig_version"
            echo "zig_windows_sha256=$zig_windows_sha256"
            echo "zig_linux_sha256=$zig_linux_sha256"
            echo "zig_macos_x86_64_sha256=$zig_macos_x86_64_sha256"
            echo "zig_macos_aarch64_sha256=$zig_macos_aarch64_sha256"
            echo "v8_version=$v8_version"
            echo "v8_revision=$v8_revision"
            echo "zig_v8_revision=$zig_v8_revision"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg build_id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg darkpanda "$GITHUB_SHA" \
            --arg canvas "$canvas_revision" \
            --arg html5ever "$html5ever_revision" \
            --arg wreq "$wreq_revision" \
            --arg boringssl "$boringssl_revision" \
            --arg py_darkpanda "$py_darkpanda_revision" \
            --arg chrome "$chrome_version" \
            --arg chromium "$chromium_revision" \
            --arg skia "$skia_revision" \
            --arg profile_sha256 "$profile_sha256" \
            --arg zig_version "$zig_version" \
            --arg zig_windows_sha256 "$zig_windows_sha256" \
            --arg zig_linux_sha256 "$zig_linux_sha256" \
            --arg zig_macos_x86_64_sha256 "$zig_macos_x86_64_sha256" \
            --arg zig_macos_aarch64_sha256 "$zig_macos_aarch64_sha256" \
            --arg v8_version "$v8_version" \
            --arg v8_revision "$v8_revision" \
            --arg zig_v8_revision "$zig_v8_revision" \
            '{
              schema: "darkpanda-resolved-inputs/v7",
              buildId: $build_id,
              policies: {
                browserProfile: "fixed-in-darkpanda",
                components: "latest-main-at-build-start",
                pythonBinding: "latest-main-at-build-start"
              },
              darkpanda: {
                repository: "AeroidesLab/darkpanda",
                revision: $darkpanda
              },
              pythonBinding: {
                repository: "AeroidesLab/py-darkpanda",
                revision: $py_darkpanda
              },
              browserProfile: {
                googleChromeStableVersion: $chrome,
                chromiumRevision: $chromium,
                skiaRevision: $skia,
                profileSha256: $profile_sha256
              },
              buildDependencies: {
                zig: {
                  version: $zig_version,
                  sha256: {
                    "windows-x86_64": $zig_windows_sha256,
                    "linux-x86_64": $zig_linux_sha256,
                    "macos-x86_64": $zig_macos_x86_64_sha256,
                    "macos-aarch64": $zig_macos_aarch64_sha256
                  }
                },
                v8: {
                  version: $v8_version,
                  revision: $v8_revision,
                  zigV8: {
                    repository: "AeroidesLab/zig-v8-fork",
                    revision: $zig_v8_revision,
                    buildMode: "source"
                  }
                }
              },
              components: {
                canvas: {
                  repository: "AeroidesLab/canvas",
                  revision: $canvas
                },
                html5ever: {
                  repository: "AeroidesLab/html5ever",
                  revision: $html5ever
                },
                wreq: {
                  repository: "AeroidesLab/wreq",
                  revision: $wreq
                },
                boringssl: {
                  repository: "AeroidesLab/boringssl",
                  revision: $boringssl
                }
              }
            }' > resolved-inputs.json

      - name: Validate every CI report and package contract
        id: contract_tests
        shell: bash
        working-directory: browser
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.ci.test_aggregate_component_reports \
            tools.ci.test_aggregate_darkpanda_reports \
            tools.ci.test_aggregate_python_wheels \
            tools.ci.test_build_python_wheel \
            tools.ci.test_creepjs_probe \
            tools.ci.test_materialize_google_chrome_stable \
            tools.ci.test_materialize_skia_cpu_deps \
            tools.ci.test_package_prebuilt \
            tools.ci.test_tls_fingerprint_compare \
            tools.ci.test_verify_chromium_toolchain \
            tools.ci.test_v8_bundle

      - name: Ensure the prepare result is machine-readable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          browser='${{ steps.checkout_browser_authority.outcome }}'
          canvas='${{ steps.checkout_canvas.outcome }}'
          html5ever='${{ steps.checkout_html5ever.outcome }}'
          wreq='${{ steps.checkout_wreq.outcome }}'
          boringssl='${{ steps.checkout_boringssl.outcome }}'
          py_darkpanda='${{ steps.checkout_py_darkpanda.outcome }}'
          resolve='${{ steps.resolve.outcome }}'
          contracts='${{ steps.contract_tests.outcome }}'
          valid=false
          if [[ -f resolved-inputs.json ]] &&
             jq -e '.schema == "darkpanda-resolved-inputs/v7"' \
               resolved-inputs.json >/dev/null &&
             [[ $browser == success &&
                $canvas == success &&
                $html5ever == success &&
                $wreq == success &&
                $boringssl == success &&
                $py_darkpanda == success &&
                $resolve == success &&
                $contracts == success ]]; then
            valid=true
          fi
          if [[ $valid != true ]]; then
            jq -n \
              --arg build_id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --arg darkpanda "$GITHUB_SHA" \
              --arg browser "$browser" \
              --arg canvas "$canvas" \
              --arg html5ever "$html5ever" \
              --arg wreq "$wreq" \
              --arg boringssl "$boringssl" \
              --arg py_darkpanda "$py_darkpanda" \
              --arg resolve "$resolve" \
              --arg contracts "$contracts" \
              '{
                schema: "darkpanda-resolved-inputs-failure/v1",
                buildId: $build_id,
                status: "failed",
                darkpandaRevision: $darkpanda,
                steps: {
                  browserCheckout: $browser,
                  canvasCheckout: $canvas,
                  html5everCheckout: $html5ever,
                   wreqCheckout: $wreq,
                   boringsslCheckout: $boringssl,
                   pyDarkpandaCheckout: $py_darkpanda,
                  resolve: $resolve,
                  contractTests: $contracts
                },
                errors: (
                  {
                    browserCheckout: $browser,
                    canvasCheckout: $canvas,
                    html5everCheckout: $html5ever,
                     wreqCheckout: $wreq,
                     boringsslCheckout: $boringssl,
                     pyDarkpandaCheckout: $py_darkpanda,
                    resolve: $resolve,
                    contractTests: $contracts
                  }
                  | to_entries
                  | map(select(.value != "success") |
                    (.key + ": " + .value))
                )
              }' > resolved-inputs.json
          fi

      - name: Publish resolved source graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-inputs
          path: resolved-inputs.json
          if-no-files-found: error
          retention-days: 30

      - name: Write source summary
        shell: bash
        run: |
          {
            echo "## Resolved build inputs"
            echo
            echo "- Browser: Chrome \`${{ steps.resolve.outputs.chrome_version }}\` (fixed)"
            echo "- Chromium: \`${{ steps.resolve.outputs.chromium_revision }}\`"
            echo "- Skia: \`${{ steps.resolve.outputs.skia_revision }}\`"
            echo "- Zig: \`${{ steps.resolve.outputs.zig_version }}\`"
            echo "- V8: \`${{ steps.resolve.outputs.v8_version }}\` (\`${{ steps.resolve.outputs.v8_revision }}\`)"
            echo "- zig-v8: \`${{ steps.resolve.outputs.zig_v8_revision }}\`"
            echo "- zig-v8 build: source from \`${{ steps.resolve.outputs.zig_v8_revision }}\`"
            echo "- Canvas: \`${{ steps.resolve.outputs.canvas_revision }}\`"
            echo "- HTML5ever: \`${{ steps.resolve.outputs.html5ever_revision }}\`"
            echo "- wreq: \`${{ steps.resolve.outputs.wreq_revision }}\`"
            echo "- BoringSSL: \`${{ steps.resolve.outputs.boringssl_revision }}\`"
            echo "- py-darkpanda: \`${{ steps.resolve.outputs.py_darkpanda_revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  toolchain:
    name: toolchain/${{ matrix.id }}
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            runner: windows-2022
            python: python
          - id: linux-x86_64
            runner: ubuntu-24.04
            python: python3
          - id: macos-x86_64
            runner: macos-15-intel
            python: python3
          - id: macos-aarch64
            runner: macos-15
            python: python3
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact browser commit as the gclient solution
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: gclient/browser
          persist-credentials: false

      - name: Install Linux sync prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates git python3 xz-utils

      - name: Install macOS CI shell prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Synchronize the profile with gclient on Windows
        if: runner.os == 'Windows'
        env:
          DEPOT_TOOLS_UPDATE: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 `
            https://chromium.googlesource.com/chromium/tools/depot_tools.git `
            gclient/depot_tools
          Push-Location gclient
          try {
            & .\depot_tools\gclient.bat config `
              --name browser `
              --unmanaged `
              https://github.com/AeroidesLab/darkpanda.git
            & .\depot_tools\gclient.bat sync `
              --no-history `
              --revision "browser@$env:GITHUB_SHA" `
              --jobs 4
          } finally {
            Pop-Location
          }

      - name: Synchronize the profile with gclient on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            gclient/depot_tools
          export PATH="$GITHUB_WORKSPACE/gclient/depot_tools:$PATH"
          cd gclient
          gclient config \
            --name browser \
            --unmanaged \
            https://github.com/AeroidesLab/darkpanda.git
          gclient sync \
            --no-history \
            --revision "browser@$GITHUB_SHA" \
            --jobs 4

      - name: Materialize Chromium-patched Skia CPU source subtrees
        shell: bash
        run: |
          set -euo pipefail
          '${{ matrix.python }}' \
            gclient/browser/tools/ci/materialize_skia_cpu_deps.py \
            --repo gclient/browser \
            --toolchain-dir gclient/browser/chromium-toolchain \
            --output gclient/browser/chromium-toolchain/metadata/skia-chromium-subtrees.json

      - name: Complete Chromium tool aliases
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          llvm_bin=gclient/browser/chromium-toolchain/llvm/bin
          test -x "$llvm_bin/llvm-ar"
          if [[ ! -e "$llvm_bin/llvm-ranlib" ]]; then
            ln -s llvm-ar "$llvm_bin/llvm-ranlib"
          fi
          test -x "$llvm_bin/llvm-ranlib"

      - name: Compile and link C and Rust probes with the macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/gclient/browser/chromium-toolchain"
          probe="$RUNNER_TEMP/darkpanda-toolchain-probe-${{ matrix.id }}"
          mkdir -p "$probe"
          printf '%s\n' 'int main(void) { return 0; }' > "$probe/main.c"
          printf '%s\n' 'fn main() {}' > "$probe/main.rs"
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          clang="$bundle/llvm/bin/clang"
          rustc="$bundle/rust/bin/rustc"
          case '${{ matrix.id }}' in
            macos-x86_64)
              clang_target=x86_64-apple-macos12
              rust_target=x86_64-apple-darwin
              ;;
            macos-aarch64)
              clang_target=arm64-apple-macos12
              rust_target=aarch64-apple-darwin
              ;;
            *) exit 1 ;;
          esac
          "$clang" --target="$clang_target" -isysroot "$sdk" \
            -mmacosx-version-min=12.0 -fuse-ld=lld \
            "$probe/main.c" -o "$probe/c-smoke"
          "$probe/c-smoke"
          "$rustc" --target "$rust_target" -C "linker=$clang" \
            -C link-arg=-fuse-ld=lld -C link-arg=-isysroot \
            -C "link-arg=$sdk" -C link-arg=-mmacosx-version-min=12.0 \
            "$probe/main.rs" -o "$probe/rust-smoke"
          "$probe/rust-smoke"

      - name: Prove the minimal graph against official Chromium DEPS
        shell: bash
        run: |
          set -euo pipefail
          '${{ matrix.python }}' \
            gclient/browser/tools/ci/verify_official_chromium_deps.py \
            --repo gclient/browser \
            --depot-tools-dir gclient/depot_tools \
            --output gclient/browser/chromium-toolchain/metadata/official-chromium-deps.json \
            --deps-output gclient/browser/chromium-toolchain/metadata/Chromium-DEPS

      - name: Verify and attest the materialized bundle
        shell: bash
        run: |
          set -euo pipefail
          '${{ matrix.python }}' \
            gclient/browser/tools/ci/verify_chromium_toolchain.py \
            --repo gclient/browser \
            --toolchain-dir gclient/browser/chromium-toolchain \
            --target '${{ matrix.id }}' \
            --depot-tools-dir gclient/depot_tools \
            --output gclient/browser/chromium-toolchain/metadata/toolchain.json

      - name: Enter the Visual Studio SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and link C and Rust probes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bundle = Resolve-Path gclient/browser/chromium-toolchain
          $probe = Join-Path $env:RUNNER_TEMP "darkpanda-toolchain-probe-${{ matrix.id }}"
          New-Item -ItemType Directory -Force $probe | Out-Null
          @'
          int main(void) { return 0; }
          '@ | Set-Content -LiteralPath (Join-Path $probe 'main.c') -Encoding ascii
          @'
          fn main() {}
          '@ | Set-Content -LiteralPath (Join-Path $probe 'main.rs') -Encoding ascii
          $clang = Join-Path $bundle 'llvm/bin/clang-cl.exe'
          $lld = Join-Path $bundle 'llvm/bin/lld-link.exe'
          $rustc = Join-Path $bundle 'rust/bin/rustc.exe'
          & $clang `
            /nologo `
            /O2 `
            (Join-Path $probe 'main.c') `
            "-fuse-ld=lld" `
            "/Fe:$(Join-Path $probe 'c-smoke.exe')"
          & (Join-Path $probe 'c-smoke.exe')
          & $rustc `
            --target x86_64-pc-windows-msvc `
            "-Clinker=$lld" `
            (Join-Path $probe 'main.rs') `
            -o (Join-Path $probe 'rust-smoke.exe')
          & (Join-Path $probe 'rust-smoke.exe')

      - name: Compile and link C and Rust probes with the Chromium sysroot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/gclient/browser/chromium-toolchain"
          probe="$RUNNER_TEMP/darkpanda-toolchain-probe-${{ matrix.id }}"
          mkdir -p "$probe"
          printf '%s\n' 'int main(void) { return 0; }' > "$probe/main.c"
          printf '%s\n' 'fn main() {}' > "$probe/main.rs"
          clang="$bundle/llvm/bin/clang"
          rustc="$bundle/rust/bin/rustc"
          sysroot="$bundle/sysroot"
          "$clang" \
            --target=x86_64-linux-gnu \
            --sysroot="$sysroot" \
            -fuse-ld=lld \
            "$probe/main.c" \
            -o "$probe/c-smoke"
          "$probe/c-smoke"
          "$rustc" \
            --target x86_64-unknown-linux-gnu \
            -C "linker=$clang" \
            -C "link-arg=--sysroot=$sysroot" \
            -C link-arg=-fuse-ld=lld \
            "$probe/main.rs" \
            -o "$probe/rust-smoke"
          "$probe/rust-smoke"

      - name: Remove verified gclient transport caches
        shell: bash
        run: |
          set -euo pipefail
          '${{ matrix.python }}' \
            gclient/browser/tools/ci/prune_gclient_payloads.py \
            --repo gclient/browser \
            --toolchain-dir gclient/browser/chromium-toolchain \
            --target '${{ matrix.id }}' \
            --output gclient/browser/chromium-toolchain/metadata/gclient-payload-prune.json

      - name: Pack the verified Chromium bundle without losing file semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain-archives
          archive="chromium-toolchain-${{ matrix.id }}.tar.gz"
          tar -C gclient/browser -czf "toolchain-archives/$archive" chromium-toolchain
          (
            cd toolchain-archives
            sha256sum "$archive" > "$archive.sha256"
          )

      - name: Record gclient result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p toolchain-reports
          depot_revision=unavailable
          if [[ -d gclient/depot_tools/.git ]]; then
            depot_revision=$(git -C gclient/depot_tools rev-parse HEAD)
          fi
          jq -n \
            --arg target '${{ matrix.id }}' \
            --arg status '${{ job.status }}' \
            --arg darkpanda "$GITHUB_SHA" \
            --arg depot_tools "$depot_revision" \
            --arg profile '${{ needs.prepare.outputs.profile_sha256 }}' \
            '{
              schema: "darkpanda-gclient-sync/v1",
              target: $target,
              status: $status,
              darkpandaRevision: $darkpanda,
              depotToolsRevision: $depot_tools,
              chromiumProfileSha256: $profile
            }' > "toolchain-reports/gclient-${{ matrix.id }}.json"

      - name: Upload verified Chromium bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-toolchain-${{ matrix.id }}
          path: toolchain-archives
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain report on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-toolchain-report-${{ matrix.id }}
          path: |
            toolchain-reports
            gclient/browser/chromium-toolchain/metadata
          if-no-files-found: warn
          retention-days: 30

  components:
    name: ${{ matrix.component }}/${{ matrix.id }}
    needs:
      - prepare
      - toolchain
    if: always() && needs.prepare.result == 'success'
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: canvas
            repository: AeroidesLab/canvas
            revision: ${{ needs.prepare.outputs.canvas_revision }}
            id: windows-x86_64
            runner: windows-2022
            python: python
            jobs: 4
          - component: canvas
            repository: AeroidesLab/canvas
            revision: ${{ needs.prepare.outputs.canvas_revision }}
            id: macos-x86_64
            runner: macos-15-intel
            python: python3
            jobs: 2
          - component: canvas
            repository: AeroidesLab/canvas
            revision: ${{ needs.prepare.outputs.canvas_revision }}
            id: macos-aarch64
            runner: macos-15
            python: python3
            jobs: 2
          - component: canvas
            repository: AeroidesLab/canvas
            revision: ${{ needs.prepare.outputs.canvas_revision }}
            id: linux-x86_64
            runner: ubuntu-24.04
            python: python3
            jobs: 4
          - component: html5ever
            repository: AeroidesLab/html5ever
            revision: ${{ needs.prepare.outputs.html5ever_revision }}
            id: windows-x86_64
            runner: windows-2022
            python: python
            jobs: 4
          - component: html5ever
            repository: AeroidesLab/html5ever
            revision: ${{ needs.prepare.outputs.html5ever_revision }}
            id: macos-x86_64
            runner: macos-15-intel
            python: python3
            jobs: 2
          - component: html5ever
            repository: AeroidesLab/html5ever
            revision: ${{ needs.prepare.outputs.html5ever_revision }}
            id: macos-aarch64
            runner: macos-15
            python: python3
            jobs: 2
          - component: html5ever
            repository: AeroidesLab/html5ever
            revision: ${{ needs.prepare.outputs.html5ever_revision }}
            id: linux-x86_64
            runner: ubuntu-24.04
            python: python3
            jobs: 4
          - component: wreq
            repository: AeroidesLab/wreq
            revision: ${{ needs.prepare.outputs.wreq_revision }}
            id: windows-x86_64
            runner: windows-2022
            python: python
            jobs: 4
          - component: wreq
            repository: AeroidesLab/wreq
            revision: ${{ needs.prepare.outputs.wreq_revision }}
            id: macos-x86_64
            runner: macos-15-intel
            python: python3
            jobs: 2
          - component: wreq
            repository: AeroidesLab/wreq
            revision: ${{ needs.prepare.outputs.wreq_revision }}
            id: macos-aarch64
            runner: macos-15
            python: python3
            jobs: 2
          - component: wreq
            repository: AeroidesLab/wreq
            revision: ${{ needs.prepare.outputs.wreq_revision }}
            id: linux-x86_64
            runner: ubuntu-24.04
            python: python3
            jobs: 4
          - component: boringssl
            repository: AeroidesLab/boringssl
            revision: ${{ needs.prepare.outputs.boringssl_revision }}
            id: windows-x86_64
            runner: windows-2022
            python: python
            jobs: 4
          - component: boringssl
            repository: AeroidesLab/boringssl
            revision: ${{ needs.prepare.outputs.boringssl_revision }}
            id: macos-x86_64
            runner: macos-15-intel
            python: python3
            jobs: 2
          - component: boringssl
            repository: AeroidesLab/boringssl
            revision: ${{ needs.prepare.outputs.boringssl_revision }}
            id: macos-aarch64
            runner: macos-15
            python: python3
            jobs: 2
          - component: boringssl
            repository: AeroidesLab/boringssl
            revision: ${{ needs.prepare.outputs.boringssl_revision }}
            id: linux-x86_64
            runner: ubuntu-24.04
            python: python3
            jobs: 4
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the resolved component source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: component
          persist-credentials: false

      - name: Verify the source-only component contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C component rev-parse HEAD)" = '${{ matrix.revision }}'
          jq -e '
            .selection_policy == "latest-at-build-start" and
            .build_owner == "AeroidesLab/darkpanda"
          ' component/source-policy.json >/dev/null
          test ! -d component/.github/workflows
          if [[ '${{ matrix.component }}' == boringssl ]]; then
            # Upstream BoringSSL intentionally versions archive/object fixtures
            # under util/ar/testdata and Rust lockfiles outside this CMake build.
            # They are source test inputs, not generated component outputs.
            forbidden=$(
              git -C component ls-files |
                grep -E '(^|/)(target|out|dist|tools-bin)/|\.(dll|dylib|so|lib|a|exe|pdb|obj|o|log)$' |
                grep -vE '^util/ar/testdata/' ||
                true
            )
          else
            forbidden=$(
              git -C component ls-files |
                grep -E '(^|/)(target|out|dist|tools-bin)/|\.(dll|dylib|so|lib|a|exe|pdb|obj|o|log)$' ||
                true
            )
          fi
          if [[ -n $forbidden ]]; then
            echo "::error::Generated or binary files are tracked by ${{ matrix.repository }}"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          if [[ '${{ matrix.component }}' != boringssl ]]; then
            lockfile=$(jq -er '.dependency_lockfile' component/source-policy.json)
            [[ $lockfile != /* && $lockfile != *..* ]] || {
              echo "::error::Unsafe dependency_lockfile: $lockfile"
              exit 1
            }
            test -f "component/$lockfile"
            git -C component ls-files --error-unmatch "$lockfile" >/dev/null
            grep -F -- '"--locked"' component/tools/build.py >/dev/null || {
              echo "::error::Component build does not enforce Cargo --locked"
              exit 1
            }
          fi

      - name: Download the shared Chromium bundle
        uses: actions/download-artifact@v4
        with:
          name: chromium-toolchain-${{ matrix.id }}
          path: toolchain-archive

      - name: Install macOS CI shell prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify and unpack the shared Chromium bundle
        env:
          MSYS: winsymlinks:nativestrict
        shell: bash
        run: |
          set -euo pipefail
          archive="chromium-toolchain-${{ matrix.id }}.tar.gz"
          (
            cd toolchain-archive
            sha256sum --check "$archive.sha256"
          )
          mkdir -p toolchain
          tar -xzf "toolchain-archive/$archive" \
            -C toolchain \
            --strip-components=1
          manifest=toolchain/metadata/toolchain.json
          '${{ matrix.python }}' - \
            "$manifest" \
            "$GITHUB_WORKSPACE/toolchain" \
            '${{ matrix.id }}' \
            '${{ needs.prepare.outputs.profile_sha256 }}' <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2]).resolve()
          expected_target = sys.argv[3]
          expected_profile = sys.argv[4]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema") != "darkpanda-chromium-toolchain/v2":
              raise SystemExit("invalid Chromium toolchain schema")
          if manifest.get("target") != expected_target:
              raise SystemExit("Chromium toolchain target mismatch")
          if manifest.get("profile_sha256") != expected_profile:
              raise SystemExit("Chromium profile digest mismatch")
          tools = manifest.get("tools")
          if not isinstance(tools, dict) or not tools:
              raise SystemExit("Chromium toolchain manifest has no tools")

          def bundle_path(relative: object, kind: str) -> pathlib.Path:
              if (
                  not isinstance(relative, str)
                  or not relative
                  or "\\" in relative
                  or re.match(r"^[A-Za-z]:", relative)
              ):
                  raise SystemExit(f"invalid bundle-relative {kind} path: {relative!r}")
              pure = pathlib.PurePosixPath(relative)
              if pure.is_absolute() or ".." in pure.parts:
                  raise SystemExit(f"unsafe bundle-relative {kind} path: {relative}")
              candidate = root.joinpath(*pure.parts).resolve()
              try:
                  candidate.relative_to(root)
              except ValueError as error:
                  raise SystemExit(f"{kind} escapes the toolchain bundle") from error
              return candidate

          for name, record in sorted(tools.items()):
              if not isinstance(record, dict):
                  raise SystemExit(f"invalid tool record: {name}")
              path = bundle_path(record.get("path"), f"tool {name}")
              if not path.is_file():
                  raise SystemExit(f"missing Chromium tool: {name}: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != record.get("sha256"):
                  raise SystemExit(f"Chromium tool digest mismatch: {name}")

          sysroot = manifest.get("sysroot")
          if sysroot is not None:
              path = bundle_path(sysroot, "sysroot")
              if not path.is_dir() or not any(path.iterdir()):
                  raise SystemExit("Chromium sysroot is missing or empty")
          PY

      - name: Enter the Visual Studio SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows build utilities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm --yes --no-progress

      - name: Install Linux build utilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates cmake git nasm perl pkg-config python3 xz-utils
          chmod +x \
            toolchain/llvm/bin/* \
            toolchain/rust/bin/* \
            toolchain/buildtools/*
          test -x toolchain/llvm/bin/clang
          test -x toolchain/llvm/bin/ld.lld
          test -x toolchain/rust/bin/cargo
          test -x toolchain/buildtools/ninja
          broken=$(
            find toolchain -type l ! -exec test -e {} \; -print
          )
          test -z "$broken" || {
            echo "::error::Broken symlinks in Chromium toolchain"
            printf '%s\n' "$broken"
            exit 1
          }

      - name: Install macOS build utilities
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake nasm pkg-config
          chmod +x toolchain/llvm/bin/* toolchain/rust/bin/* toolchain/buildtools/*
          test -x toolchain/llvm/bin/clang
          test -x toolchain/llvm/bin/ld64.lld
          test -x toolchain/rust/bin/cargo
          test -x toolchain/buildtools/ninja

      - name: Build, test, and stage the component
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          set +e
          '${{ matrix.python }}' component/tools/build.py \
            --target '${{ matrix.id }}' \
            --profile release \
            --out "$GITHUB_WORKSPACE/component-dist/${{ matrix.component }}/${{ matrix.id }}" \
            --jobs '${{ matrix.jobs }}' \
            --toolchain chromium \
            --toolchain-dir "$GITHUB_WORKSPACE/toolchain" \
            2>&1 | tee "logs/${{ matrix.component }}-${{ matrix.id }}.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            failure_tail=$(tail -n 20 "logs/${{ matrix.component }}-${{ matrix.id }}.log")
            failure_tail=${failure_tail//'%'/'%25'}
            failure_tail=${failure_tail//$'\r'/'%0D'}
            failure_tail=${failure_tail//$'\n'/'%0A'}
            echo "::error title=${{ matrix.component }}/${{ matrix.id }}::$failure_tail"
            exit "$build_status"
          fi

      - name: Ensure a machine-readable failure report exists
        if: always()
        shell: bash
        run: |
          set -u
          metadata="component-dist/${{ matrix.component }}/${{ matrix.id }}/metadata"
          mkdir -p "$metadata"
          if [[ ! -f "$metadata/test-results.json" ]]; then
            jq -n \
              --arg component '${{ matrix.component }}' \
              --arg target '${{ matrix.id }}' \
              --arg status '${{ steps.build.outcome }}' \
              '{
                schema: "darkpanda-component-test-results/v1",
                component: $component,
                target: $target,
                status: $status,
                suites: []
              }' > "$metadata/test-results.json"
          fi

      - name: Write component summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.component }} / ${{ matrix.id }}"
            echo
            echo "- Source: \`${{ matrix.revision }}\`"
            echo "- Result: \`${{ steps.build.outcome }}\`"
            if [[ -f "component-dist/${{ matrix.component }}/${{ matrix.id }}/metadata/build-info.json" ]]; then
              echo "- Toolchain: Chromium fixed profile"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload component dist, test reports, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.component }}-${{ matrix.id }}
          path: |
            component-dist/${{ matrix.component }}/${{ matrix.id }}
            logs
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  native-summary:
    name: native
    needs:
      - prepare
      - components
    if: always() && inputs.fingerprint_source_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Download every component result
        id: download-components
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: component-*
          path: component-results

      - name: Download the resolved source graph
        id: download-inputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: resolved-inputs
          path: resolved-inputs

      - name: Check out the report validator
        id: checkout_validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: browser
          persist-credentials: false

      - name: Validate and aggregate every component contract
        id: aggregate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 browser/tools/ci/aggregate_component_reports.py \
            --results component-results \
            --resolved-inputs resolved-inputs/resolved-inputs.json \
            --output reports/summary.json \
            --markdown reports/summary.md

      - name: Ensure the native gate failure is machine-readable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if ! jq -e '
            .schema == "darkpanda-native-summary/v2" and
            (.status == "passed" or .status == "failed") and
            (.passed | type == "number") and
            .total == 16 and
            (.errors | type == "array") and
            (.results | type == "array")
          ' reports/summary.json >/dev/null 2>&1; then
            jq -n \
              --arg components '${{ steps.download-components.outcome }}' \
              --arg inputs '${{ steps.download-inputs.outcome }}' \
              --arg checkout '${{ steps.checkout_validator.outcome }}' \
              --arg aggregate '${{ steps.aggregate.outcome }}' \
              '{
                schema: "darkpanda-native-summary/v2",
                status: "failed",
                passed: 0,
                total: 16,
                errors: [
                  "native component validator could not produce a valid report",
                  ("component download: " + $components),
                  ("resolved input download: " + $inputs),
                  ("validator checkout: " + $checkout),
                  ("aggregate: " + $aggregate)
                ],
                results: []
              }' > reports/summary.json
          fi
          if [[ ! -f reports/summary.md ]]; then
            printf '%s\n' \
              '## Native component gate' \
              '' \
              '- Status: `failed`' \
              '- The native component validator could not produce a valid report.' \
              > reports/summary.md
          fi

      - name: Publish the complete native summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/summary.md ]]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' \
              '## Native component gate' \
              '' \
              'The aggregate report could not be generated.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-component-report
          path: reports
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce the native component gate
        if: always()
        shell: bash
        run: |
          test '${{ steps.download-components.outcome }}' = success
          test '${{ steps.download-inputs.outcome }}' = success
          test '${{ steps.aggregate.outcome }}' = success

  darkpanda:
    name: build/${{ matrix.id }}
    needs:
      - prepare
      - native-summary
    if: always() && needs.prepare.result == 'success' && needs.native-summary.result == 'success'
    timeout-minutes: 360
    env:
      ZIG_VERSION: ${{ needs.prepare.outputs.zig_version }}
      V8_VERSION: ${{ needs.prepare.outputs.v8_version }}
      V8_REVISION: ${{ needs.prepare.outputs.v8_revision }}
      ZIG_V8_SOURCE_REVISION: ${{ needs.prepare.outputs.zig_v8_revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            runner: windows-2022
            platform: windows
            zig_arch: x86_64
            zig_target: x86_64-windows-msvc
            zig_sha256: ${{ needs.prepare.outputs.zig_windows_sha256 }}
            v8_archive: c_v8_standalone.lib
            python_cmd: python
            jobs: 4
            deployment: na
          - id: linux-x86_64
            runner: ubuntu-22.04
            platform: linux
            zig_arch: x86_64
            zig_target: x86_64-linux-gnu
            zig_sha256: ${{ needs.prepare.outputs.zig_linux_sha256 }}
            v8_archive: libc_v8_standalone.a
            python_cmd: python3
            jobs: 2
            deployment: na
          - id: macos-x86_64
            runner: macos-15-intel
            platform: macos
            zig_arch: x86_64
            zig_target: x86_64-macos.12.0
            zig_sha256: ${{ needs.prepare.outputs.zig_macos_x86_64_sha256 }}
            v8_archive: libc_v8_standalone.a
            python_cmd: python3
            jobs: 2
            deployment: "12.0"
          - id: macos-aarch64
            runner: macos-15
            platform: macos
            zig_arch: aarch64
            zig_target: aarch64-macos.12.0
            zig_sha256: ${{ needs.prepare.outputs.zig_macos_aarch64_sha256 }}
            v8_archive: libc_v8_standalone.a
            python_cmd: python3
            jobs: 2
            deployment: "12.0"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact DarkPanda source
        id: checkout_browser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: browser
          persist-credentials: false

      - name: Check out the fixed zig-v8 source
        id: checkout_zig_v8
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/zig-v8-fork
          ref: ${{ needs.prepare.outputs.zig_v8_revision }}
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: zig-v8-fork
          persist-credentials: false

      - name: Download and merge all four native component dists
        id: download_components
        uses: actions/download-artifact@v4
        with:
          pattern: component-*-${{ matrix.id }}
          path: component-downloads
          merge-multiple: true

      - name: Download the immutable source graph
        id: download_inputs
        uses: actions/download-artifact@v4
        with:
          name: resolved-inputs
          path: resolved-inputs

      - name: Download the verified Chromium LLVM bundle for Windows PFFFT
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: chromium-toolchain-${{ matrix.id }}
          path: pffft-toolchain-archive

      - name: Verify and unpack the Windows PFFFT toolchain
        if: runner.os == 'Windows'
        env:
          MSYS: winsymlinks:nativestrict
        shell: bash
        run: |
          set -euo pipefail
          archive="chromium-toolchain-${{ matrix.id }}.tar.gz"
          (
            cd pffft-toolchain-archive
            sha256sum --check "$archive.sha256"
          )
          mkdir -p pffft-toolchain
          tar -xzf "pffft-toolchain-archive/$archive" \
            -C pffft-toolchain \
            --strip-components=1
          manifest=pffft-toolchain/metadata/toolchain.json
          jq -e \
            --arg target '${{ matrix.id }}' \
            --arg profile '${{ needs.prepare.outputs.profile_sha256 }}' \
            '.schema == "darkpanda-chromium-toolchain/v2" and
             .target == $target and
             .profile_sha256 == $profile' \
            "$manifest" >/dev/null
          test -x pffft-toolchain/llvm/bin/clang-cl.exe
          test -x pffft-toolchain/llvm/bin/lld-link.exe
          pffft_toolchain_dir=$(cygpath -w \
            "$GITHUB_WORKSPACE/pffft-toolchain/llvm/bin")
          echo "PFFFT_TOOLCHAIN_DIR=$pffft_toolchain_dir" >> "$GITHUB_ENV"

      - name: Install macOS CI shell prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify source identities and component provenance
        id: source_contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C browser rev-parse HEAD)" = "$GITHUB_SHA"
          # The fork owns both the binding and the source-built V8 archive on
          # every platform.
          test "$(git -C zig-v8-fork rev-parse HEAD)" = "$ZIG_V8_SOURCE_REVISION"
          grep -Eq \
            "const V8_VERSION[^=]*=[[:space:]]*\"$V8_VERSION\"" \
            zig-v8-fork/build.zig
          grep -Eq \
            "const V8_REVISION[^=]*=[[:space:]]*\"$V8_REVISION\"" \
            zig-v8-fork/build.zig
          if [[ '${{ matrix.platform }}' == linux ]]; then
            grep -F 'v8_monolithic_for_shared_library=true' \
              zig-v8-fork/build.zig >/dev/null
          fi
          test ! -d zig-v8-fork/.github/workflows
          jq -e '
            .build_owner == "AeroidesLab/darkpanda" and
            .selection_policy == "fixed-by-darkpanda-profile" and
            .artifacts == "source-only"
          ' zig-v8-fork/source-policy.json >/dev/null
          resolved=resolved-inputs/resolved-inputs.json
          jq -e \
            --arg darkpanda "$GITHUB_SHA" \
            --arg profile '${{ needs.prepare.outputs.profile_sha256 }}' \
            --arg chrome '${{ needs.prepare.outputs.chrome_version }}' \
            --arg zig "$ZIG_VERSION" \
            --arg v8 "$V8_VERSION" \
            --arg v8_revision "$V8_REVISION" \
            --arg zig_v8 "$ZIG_V8_SOURCE_REVISION" \
            '.schema == "darkpanda-resolved-inputs/v7" and
             .darkpanda.revision == $darkpanda and
             .browserProfile.profileSha256 == $profile and
             .browserProfile.googleChromeStableVersion == $chrome and
             .buildDependencies.zig.version == $zig and
             .buildDependencies.v8.version == $v8 and
             .buildDependencies.v8.revision == $v8_revision and
             .buildDependencies.v8.zigV8.repository == "AeroidesLab/zig-v8-fork" and
             .buildDependencies.v8.zigV8.revision == $zig_v8 and
             .buildDependencies.v8.zigV8.buildMode == "source"' \
            "$resolved" >/dev/null

          declare -A revisions=(
            [canvas]='${{ needs.prepare.outputs.canvas_revision }}'
            [html5ever]='${{ needs.prepare.outputs.html5ever_revision }}'
            [wreq]='${{ needs.prepare.outputs.wreq_revision }}'
            [boringssl]='${{ needs.prepare.outputs.boringssl_revision }}'
          )
          toolchain_manifest_sha=
          for component in canvas html5ever wreq boringssl; do
            dist="component-downloads/component-dist/$component/${{ matrix.id }}"
            info="$dist/metadata/build-info.json"
            tests="$dist/metadata/test-results.json"
            test -d "$dist"
            test -f "$info"
            test -f "$tests"
            expected=${revisions[$component]}
            test "$(jq -r --arg name "$component" '.components[$name].revision' "$resolved")" = "$expected"
            actual=$(jq -r '.source.revision // .canvasRevision // empty' "$info")
            requested_target=$(jq -r '.requestedTarget // .target // empty' "$info")
            test "$actual" = "$expected"
            test "$requested_target" = '${{ matrix.id }}'
            test "$(jq -r .component "$info")" = "$component"
            test "$(jq -r .chromiumProfileSha256 "$info")" = \
              '${{ needs.prepare.outputs.profile_sha256 }}'
            test "$(jq -r .source.dirty "$info")" = false
            manifest_sha=$(jq -er '.toolchainManifestSha256 |
              select(test("^[0-9a-f]{64}$"))' "$info")
            if [[ -z $toolchain_manifest_sha ]]; then
              toolchain_manifest_sha=$manifest_sha
            else
              test "$manifest_sha" = "$toolchain_manifest_sha"
            fi
            test "$(jq -r '.requestedTarget // .target // empty' "$tests")" = \
              '${{ matrix.id }}'
            test "$(jq -r .status "$tests")" = passed
          done

          mapfile -t component_dirs < <(
            for path in component-downloads/component-dist/*; do
              [[ -d $path ]] && printf '%s\n' "${path##*/}"
            done | sort
          )
          test "${component_dirs[*]}" = 'boringssl canvas html5ever wreq'

          source_revision=$(git -C browser rev-parse HEAD)
          source_epoch=$(git -C browser show -s --format=%ct HEAD)
          version="1.0.0-ci.${GITHUB_RUN_NUMBER}+${source_revision:0:12}"
          rust_version=$(jq -er '.toolchain.tools.rustc.version' \
            "component-downloads/component-dist/html5ever/${{ matrix.id }}/metadata/build-info.json")
          {
            echo "SOURCE_REVISION=$source_revision"
            echo "SOURCE_DATE_EPOCH=$source_epoch"
            echo "DARKPANDA_BUILD_VERSION=$version"
            echo "CHROMIUM_RUST_VERSION=$rust_version"
          } >> "$GITHUB_ENV"

      - name: Configure Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = [ordered]@{
            CANVAS_DIST = (Resolve-Path 'component-downloads/component-dist/canvas/${{ matrix.id }}').Path
            HTML5EVER_DIST = (Resolve-Path 'component-downloads/component-dist/html5ever/${{ matrix.id }}').Path
            WREQ_DIST = (Resolve-Path 'component-downloads/component-dist/wreq/${{ matrix.id }}').Path
            BORINGSSL_DIST = (Resolve-Path 'component-downloads/component-dist/boringssl/${{ matrix.id }}').Path
            DARKPANDA_INSTALL_ROOT = (Join-Path $env:RUNNER_TEMP 'darkpanda-install-${{ matrix.id }}')
            DARKPANDA_CACHE_DIR = (Join-Path $env:RUNNER_TEMP 'darkpanda-zig-cache-${{ matrix.id }}')
            DARKPANDA_GLOBAL_CACHE_DIR = (Join-Path $env:RUNNER_TEMP 'darkpanda-zig-global-${{ matrix.id }}')
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          New-Item -ItemType Directory -Force logs,reports | Out-Null

      - name: Configure Unix build paths
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CANVAS_DIST=$GITHUB_WORKSPACE/component-downloads/component-dist/canvas/${{ matrix.id }}"
            echo "HTML5EVER_DIST=$GITHUB_WORKSPACE/component-downloads/component-dist/html5ever/${{ matrix.id }}"
            echo "WREQ_DIST=$GITHUB_WORKSPACE/component-downloads/component-dist/wreq/${{ matrix.id }}"
            echo "BORINGSSL_DIST=$GITHUB_WORKSPACE/component-downloads/component-dist/boringssl/${{ matrix.id }}"
            echo "DARKPANDA_INSTALL_ROOT=$RUNNER_TEMP/darkpanda-install-${{ matrix.id }}"
            echo "DARKPANDA_CACHE_DIR=$RUNNER_TEMP/darkpanda-zig-cache-${{ matrix.id }}"
            echo "DARKPANDA_GLOBAL_CACHE_DIR=$RUNNER_TEMP/darkpanda-zig-global-${{ matrix.id }}"
          } >> "$GITHUB_ENV"
          mkdir -p logs reports

      - name: Install Linux V8 build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates git python3 xz-utils

      - name: Install macOS V8 build prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config

      - name: Enter the Visual Studio SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the fixed Zig compiler on Windows
        if: runner.os == 'Windows'
        id: install_zig_windows
        shell: pwsh
        run: |
          ./browser/tools/ci/Install-Zig.ps1 `
            -Version $env:ZIG_VERSION `
            -Architecture '${{ matrix.zig_arch }}' `
            -Sha256 '${{ matrix.zig_sha256 }}' `
            -InstallRoot "$env:RUNNER_TOOL_CACHE/darkpanda-zig/$env:ZIG_VERSION/${{ matrix.zig_arch }}"

      - name: Install the fixed Zig compiler on Unix
        if: runner.os != 'Windows'
        id: install_zig_linux
        shell: bash
        run: |
          bash browser/tools/ci/install-zig.sh \
            "$ZIG_VERSION" \
            '${{ matrix.zig_arch }}' \
            '${{ matrix.zig_sha256 }}' \
            "$RUNNER_TOOL_CACHE/darkpanda-zig/$ZIG_VERSION/${{ matrix.zig_arch }}"

      - name: Restore or save the immutable V8 dependency bundle
        id: v8_cache
        uses: actions/cache@v4
        with:
          path: dependency-cache/${{ matrix.id }}/v8
          key: darkpanda-v8-${{ matrix.id }}-zig-${{ env.ZIG_VERSION }}-v8-${{ env.V8_VERSION }}-${{ env.ZIG_V8_SOURCE_REVISION }}-source-target-${{ matrix.zig_target }}-deployment-${{ matrix.deployment }}-${{ env.CACHE_GENERATION }}
          enableCrossOsArchive: false

      - name: Build the fixed V8 dependency bundle on Windows
        if: runner.os == 'Windows' && steps.v8_cache.outputs.cache-hit != 'true'
        id: v8_build_windows
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'darkpanda-v8-source'
          $localCache = Join-Path $env:RUNNER_TEMP 'darkpanda-v8-zig-cache'
          $globalCache = Join-Path $env:RUNNER_TEMP 'darkpanda-v8-zig-global-cache'
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'dependency-cache/${{ matrix.id }}/v8'
          Remove-Item -LiteralPath $sourceRoot,$localCache,$globalCache,$bundleRoot `
            -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $sourceRoot,$localCache,$globalCache,$bundleRoot `
            -Force | Out-Null
          Push-Location zig-v8-fork
          try {
            zig build build-v8 `
              -j${{ matrix.jobs }} `
              -Dtarget=${{ matrix.zig_target }} `
              -Doptimize=ReleaseFast `
              -Dsymbol_level=0 `
              "-Dcache_root=$sourceRoot" `
              --cache-dir $localCache `
              --global-cache-dir $globalCache `
              --summary all `
              2>&1 | Tee-Object -FilePath ../logs/v8-build-${{ matrix.id }}.log
          } finally {
            Pop-Location
          }
          $candidates = @(
            Get-ChildItem -LiteralPath $localCache -Recurse -File `
              -Filter 'c_v8_standalone.lib'
          )
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one standalone V8 archive, found $($candidates.Count)"
          }
          $archive = Join-Path $bundleRoot '${{ matrix.v8_archive }}'
          Copy-Item -LiteralPath $candidates[0].FullName -Destination $archive
          python browser/tools/ci/v8_bundle.py create `
            --archive $archive `
            --manifest (Join-Path $bundleRoot 'manifest.json') `
            --build-mode source `
            --platform '${{ matrix.id }}' `
            --target '${{ matrix.zig_target }}' `
            --v8-version $env:V8_VERSION `
            --v8-revision $env:V8_REVISION `
            --zig-v8-source-revision $env:ZIG_V8_SOURCE_REVISION `
            --zig-version $env:ZIG_VERSION

      - name: Build the fixed V8 dependency bundle on Unix
        if: runner.os != 'Windows' && steps.v8_cache.outputs.cache-hit != 'true'
        id: v8_build_unix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/darkpanda-v8-source-${{ matrix.id }}"
          local_cache="$RUNNER_TEMP/darkpanda-v8-zig-cache-${{ matrix.id }}"
          global_cache="$RUNNER_TEMP/darkpanda-v8-zig-global-${{ matrix.id }}"
          bundle_root="$GITHUB_WORKSPACE/dependency-cache/${{ matrix.id }}/v8"
          rm -rf -- "$source_root" "$local_cache" "$global_cache" "$bundle_root"
          mkdir -p "$source_root" "$local_cache" "$global_cache" "$bundle_root"
          (
            cd zig-v8-fork
            zig build build-v8 \
              '-j${{ matrix.jobs }}' \
              -Dtarget='${{ matrix.zig_target }}' \
              -Doptimize=ReleaseFast \
              -Dsymbol_level=0 \
              -Dcache_root="$source_root" \
              --cache-dir "$local_cache" \
              --global-cache-dir "$global_cache" \
              --summary all
          ) 2>&1 | tee "logs/v8-build-${{ matrix.id }}.log"
          mapfile -t candidates < <(
            find "$source_root" "$local_cache" -type f \
              -name '${{ matrix.v8_archive }}' -print | sort
          )
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" "$bundle_root/${{ matrix.v8_archive }}"
          python3 browser/tools/ci/v8_bundle.py create \
            --archive "$bundle_root/${{ matrix.v8_archive }}" \
            --manifest "$bundle_root/manifest.json" \
            --build-mode source \
            --platform '${{ matrix.id }}' \
            --target '${{ matrix.zig_target }}' \
            --v8-version "$V8_VERSION" \
            --v8-revision "$V8_REVISION" \
            --zig-v8-source-revision "$ZIG_V8_SOURCE_REVISION" \
            --zig-version "$ZIG_VERSION"

      - name: Verify the V8 cache contract
        id: v8_verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          archive=$('${{ matrix.python_cmd }}' browser/tools/ci/v8_bundle.py verify \
            --manifest "dependency-cache/${{ matrix.id }}/v8/manifest.json" \
            --build-mode source \
            --platform '${{ matrix.id }}' \
            --target '${{ matrix.zig_target }}' \
            --v8-version "$V8_VERSION" \
            --v8-revision "$V8_REVISION" \
            --zig-v8-source-revision "$ZIG_V8_SOURCE_REVISION" \
            --zig-version "$ZIG_VERSION")
          [[ $archive == *'${{ matrix.v8_archive }}' ]]
          if [[ '${{ matrix.platform }}' != windows ]]; then
            nm -g "$archive" > "logs/v8-symbols-${{ matrix.id }}.txt"
            for symbol in \
              v8__V8__Initialize \
              v8__Isolate__New \
              v8__Context__New; do
              grep -Eq "[[:space:]]_?${symbol}$" \
                "logs/v8-symbols-${{ matrix.id }}.txt" || {
                  echo "::error::V8 wrapper symbol is missing: $symbol"
                  exit 1
                }
            done
          fi
          if [[ '${{ matrix.platform }}' == linux ]] &&
             readelf --relocs --wide --demangle "$archive" |
               grep -E 'R_X86_64_TPOFF32.*v8::internal::g_current_(isolate|local_heap)' \
                 >/dev/null; then
            echo "::error::V8 archive contains local-exec TLS relocations and cannot link into libdarkpanda.so"
            exit 1
          fi
          v8_sha=$('${{ matrix.python_cmd }}' -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archive"]["sha256"])' \
            "dependency-cache/${{ matrix.id }}/v8/manifest.json")
          {
            echo "V8_ARCHIVE=$archive"
            echo "V8_ARCHIVE_SHA256=$v8_sha"
          } >> "$GITHUB_ENV"

      - name: Install the ReleaseFast runtime on Windows
        if: runner.os == 'Windows'
        id: install_windows
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item -LiteralPath $env:DARKPANDA_INSTALL_ROOT -Recurse -Force `
            -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:DARKPANDA_INSTALL_ROOT | Out-Null
          Push-Location browser
          try {
            zig build install `
              -j${{ matrix.jobs }} `
              -Dtarget=${{ matrix.zig_target }} `
              -Doptimize=ReleaseFast `
              "-Dprebuilt_v8_path=$env:V8_ARCHIVE" `
              "-Dpffft_toolchain_dir=$env:PFFFT_TOOLCHAIN_DIR" `
              "-Dcanvas_dist=$env:CANVAS_DIST" `
              "-Dhtml5ever_dist=$env:HTML5EVER_DIST" `
              "-Dwreq_dist=$env:WREQ_DIST" `
              "-Dboringssl_dist=$env:BORINGSSL_DIST" `
              "-Dversion=$env:DARKPANDA_BUILD_VERSION" `
              -p $env:DARKPANDA_INSTALL_ROOT `
              --cache-dir $env:DARKPANDA_CACHE_DIR `
              --global-cache-dir $env:DARKPANDA_GLOBAL_CACHE_DIR `
              --summary all `
              2>&1 | Tee-Object -FilePath ../logs/install-${{ matrix.id }}.log
          } finally {
            Pop-Location
          }

      - name: Install the ReleaseFast runtime on Unix
        if: runner.os != 'Windows'
        id: install_linux
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf -- "$DARKPANDA_INSTALL_ROOT"
          mkdir -p "$DARKPANDA_INSTALL_ROOT"
          (
            cd browser
            zig build install \
              '-j${{ matrix.jobs }}' \
              -Dtarget='${{ matrix.zig_target }}' \
              -Doptimize=ReleaseFast \
              -Dprebuilt_v8_path="$V8_ARCHIVE" \
              -Dcanvas_dist="$CANVAS_DIST" \
              -Dhtml5ever_dist="$HTML5EVER_DIST" \
              -Dwreq_dist="$WREQ_DIST" \
              -Dboringssl_dist="$BORINGSSL_DIST" \
              -Dversion="$DARKPANDA_BUILD_VERSION" \
              -p "$DARKPANDA_INSTALL_ROOT" \
              --cache-dir "$DARKPANDA_CACHE_DIR" \
              --global-cache-dir "$DARKPANDA_GLOBAL_CACHE_DIR" \
              --summary all
          ) 2>&1 | tee "logs/install-${{ matrix.id }}.log"

      - name: Bundle the Windows Visual C++ runtime closure
        if: runner.os == 'Windows'
        id: vc_runtime
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = (& $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest `
            -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($visualStudio)) {
            throw 'Visual Studio VC Redistributable installation was not found'
          }
          $redistVersions = @(
            Get-ChildItem -LiteralPath (Join-Path $visualStudio 'VC/Redist/MSVC') `
              -Directory |
              Where-Object { $_.Name -match '^\d+\.' } |
              Sort-Object Name -Descending
          )
          if ($redistVersions.Count -eq 0) {
            throw 'Visual Studio VC Redistributable version directory was not found'
          }
          $x64Redist = Join-Path $redistVersions[0].FullName 'x64'
          $crtDirectories = @(
            Get-ChildItem -LiteralPath $x64Redist -Directory |
              Where-Object { $_.Name -match '^Microsoft\.VC[0-9]+\.CRT$' }
          )
          if ($crtDirectories.Count -ne 1) {
            throw "Expected one x64 VC runtime directory, found $($crtDirectories.Count)"
          }
          $bin = Join-Path $env:DARKPANDA_INSTALL_ROOT 'bin'
          foreach ($name in @(
            'msvcp140.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll'
          )) {
            $source = Join-Path $crtDirectories[0].FullName $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing VC runtime library: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $bin $name)
          }

      - name: Package the deterministic Windows runtime
        if: runner.os == 'Windows'
        id: package_windows
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = Join-Path $env:GITHUB_WORKSPACE 'prebuilt/${{ matrix.id }}'
          Remove-Item -LiteralPath $output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $output | Out-Null
          python browser/tools/ci/package_prebuilt.py `
            --repo (Resolve-Path browser).Path `
            --install-root $env:DARKPANDA_INSTALL_ROOT `
            --output-dir $output `
            --package-runtime-attestation (Join-Path $env:GITHUB_WORKSPACE 'reports/packaged-runtime-${{ matrix.id }}.json') `
            --canvas-dist $env:CANVAS_DIST `
            --html5ever-dist $env:HTML5EVER_DIST `
            --wreq-dist $env:WREQ_DIST `
            --boringssl-dist $env:BORINGSSL_DIST `
            --platform '${{ matrix.platform }}' `
            --target '${{ matrix.zig_target }}' `
            --version $env:DARKPANDA_BUILD_VERSION `
            --repository $env:GITHUB_REPOSITORY `
            --source-revision $env:SOURCE_REVISION `
            --source-date-epoch $env:SOURCE_DATE_EPOCH `
            --v8-version $env:V8_VERSION `
            --v8-revision $env:V8_REVISION `
            --v8-archive-sha256 $env:V8_ARCHIVE_SHA256 `
            --zig-v8-source-revision $env:ZIG_V8_SOURCE_REVISION `
            --boringssl-source-revision '${{ needs.prepare.outputs.boringssl_revision }}' `
            --zig-version $env:ZIG_VERSION `
            --rust-version $env:CHROMIUM_RUST_VERSION `
            --runner-image "$env:ImageOS/$env:ImageVersion" `
            2>&1 | Tee-Object -FilePath logs/package-${{ matrix.id }}.log
          Get-ChildItem -LiteralPath $output -Directory -Filter 'darkpanda-*' |
            Remove-Item -Recurse -Force

      - name: Package the deterministic Unix runtime
        if: runner.os != 'Windows'
        id: package_linux
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          output="$GITHUB_WORKSPACE/prebuilt/${{ matrix.id }}"
          rm -rf -- "$output"
          mkdir -p "$output"
          python3 browser/tools/ci/package_prebuilt.py \
            --repo browser \
            --install-root "$DARKPANDA_INSTALL_ROOT" \
            --output-dir "$output" \
            --package-runtime-attestation \
              "$GITHUB_WORKSPACE/reports/packaged-runtime-${{ matrix.id }}.json" \
            --canvas-dist "$CANVAS_DIST" \
            --html5ever-dist "$HTML5EVER_DIST" \
            --wreq-dist "$WREQ_DIST" \
            --boringssl-dist "$BORINGSSL_DIST" \
            --platform '${{ matrix.platform }}' \
            --target '${{ matrix.zig_target }}' \
            --version "$DARKPANDA_BUILD_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$SOURCE_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --v8-version "$V8_VERSION" \
            --v8-revision "$V8_REVISION" \
            --v8-archive-sha256 "$V8_ARCHIVE_SHA256" \
            --zig-v8-source-revision "$ZIG_V8_SOURCE_REVISION" \
            --boringssl-source-revision '${{ needs.prepare.outputs.boringssl_revision }}' \
            --zig-version "$ZIG_VERSION" \
            --rust-version "$CHROMIUM_RUST_VERSION" \
            --runner-image "${ImageOS:-unknown}/${ImageVersion:-unknown}" \
            2>&1 | tee "logs/package-${{ matrix.id }}.log"
          rm -rf -- "$output"/darkpanda-*/

      - name: Write the platform result
        if: always()
        shell: bash
        run: |
          set +e
          set -u
          mkdir -p reports
          if [[ '${{ matrix.platform }}' == windows ]]; then
            install_zig='${{ steps.install_zig_windows.outcome }}'
            install='${{ steps.install_windows.outcome }}'
            package='${{ steps.package_windows.outcome }}'
            vc_runtime='${{ steps.vc_runtime.outcome }}'
            v8_build='${{ steps.v8_build_windows.outcome }}'
          else
            install_zig='${{ steps.install_zig_linux.outcome }}'
            install='${{ steps.install_linux.outcome }}'
            package='${{ steps.package_linux.outcome }}'
            vc_runtime=success
            v8_build='${{ steps.v8_build_unix.outcome }}'
          fi
          if [[ '${{ steps.v8_cache.outputs.cache-hit }}' == true ]]; then
            v8_build=success
          fi
          status=passed
          for outcome in \
            '${{ steps.source_contract.outcome }}' \
            "$install_zig" \
            "$v8_build" \
            '${{ steps.v8_verify.outcome }}' \
            "$install" \
            "$vc_runtime" \
            "$package"; do
            [[ $outcome == success ]] || status=failed
          done

          packaged_runtime="reports/packaged-runtime-${{ matrix.id }}.json"
          if [[ ! -f $packaged_runtime ]] ||
             ! jq -e . "$packaged_runtime" >/dev/null 2>&1; then
            jq -n \
              --arg target '${{ matrix.id }}' \
              '{
                schema: "darkpanda-packaged-runtime-attestation/v1",
                status: "FAIL",
                target: $target,
                error: "package runtime attestation did not produce valid JSON"
              }' > "$packaged_runtime"
            status=failed
          fi
          packaged_runtime_sha=$(sha256sum "$packaged_runtime" | cut -d' ' -f1)
          resolved_sha=unavailable
          if [[ -f resolved-inputs/resolved-inputs.json ]]; then
            resolved_sha=$(sha256sum resolved-inputs/resolved-inputs.json | cut -d' ' -f1)
          else
            status=failed
          fi

          package_dir="prebuilt/${{ matrix.id }}"
          archive_name=
          archive_sha=
          if [[ -d $package_dir ]]; then
            mapfile -t archives < <(
              find "$package_dir" -maxdepth 1 -type f \
                \( -name '*.zip' -o -name '*.tar.gz' \) -print |
                while IFS= read -r archive; do
                  printf '%s\n' "${archive##*/}"
                done | sort
            )
            if [[ ${#archives[@]} -eq 1 ]]; then
              archive_name=${archives[0]}
              archive_sha=$(sha256sum "$package_dir/$archive_name" | cut -d' ' -f1)
            else
              status=failed
            fi
          else
            status=failed
          fi

          jq -n \
            --arg target '${{ matrix.id }}' \
            --arg platform '${{ matrix.platform }}' \
            --arg status "$status" \
            --arg source "$GITHUB_SHA" \
            --arg profile '${{ needs.prepare.outputs.profile_sha256 }}' \
            --arg resolved_sha "$resolved_sha" \
            --arg canvas '${{ needs.prepare.outputs.canvas_revision }}' \
            --arg html5ever '${{ needs.prepare.outputs.html5ever_revision }}' \
            --arg wreq '${{ needs.prepare.outputs.wreq_revision }}' \
            --arg boringssl '${{ needs.prepare.outputs.boringssl_revision }}' \
            --arg v8_version "$V8_VERSION" \
            --arg v8_revision "$V8_REVISION" \
            --arg zig_v8 "$ZIG_V8_SOURCE_REVISION" \
            --arg source_contract '${{ steps.source_contract.outcome }}' \
            --arg install_zig "$install_zig" \
            --arg v8_build "$v8_build" \
            --arg v8_verify '${{ steps.v8_verify.outcome }}' \
            --arg install "$install" \
            --arg vc_runtime "$vc_runtime" \
            --arg package "$package" \
            --arg packaged_runtime_sha "$packaged_runtime_sha" \
            --arg archive_name "$archive_name" \
            --arg archive_sha "$archive_sha" \
            '{
              schema: "darkpanda-platform-result/v2",
              target: $target,
              platform: $platform,
              status: $status,
              sourceRevision: $source,
              chromiumProfileSha256: $profile,
              resolvedInputsSha256: $resolved_sha,
              components: {
                canvas: $canvas,
                html5ever: $html5ever,
                wreq: $wreq,
                boringssl: $boringssl
              },
              v8Version: $v8_version,
              v8Revision: $v8_revision,
              zigV8SourceRevision: $zig_v8,
              zigV8Prebuilt: null,
              steps: {
                sourceContract: $source_contract,
                installZig: $install_zig,
                v8Build: $v8_build,
                v8Verify: $v8_verify,
                install: $install,
                vcRuntime: $vc_runtime,
                package: $package
              },
              reports: {
                packageRuntimeAttestationSha256: $packaged_runtime_sha
              },
              package: {
                name: $archive_name,
                sha256: $archive_sha
              }
            }' > "reports/darkpanda-${{ matrix.id }}.json"

      - name: Publish the platform summary
        if: always()
        shell: bash
        run: |
          report="reports/darkpanda-${{ matrix.id }}.json"
          {
            echo "## DarkPanda / ${{ matrix.id }}"
            echo
            echo "- Result: \`$(jq -r .status "$report")\`"
            echo "- Package: \`$(jq -r .package.name "$report")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package result and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkpanda-result-${{ matrix.id }}
          path: |
            reports
            logs
            prebuilt/${{ matrix.id }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Enforce the platform gate
        if: always()
        shell: bash
        run: |
          jq -e '.status == "passed"' \
            "reports/darkpanda-${{ matrix.id }}.json" >/dev/null

  python:
    name: python/${{ matrix.id }}
    needs:
      - prepare
      - toolchain
      - darkpanda
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            runner: windows-2022
            python_cmd: python
            jobs: 4
          - id: linux-x86_64
            runner: ubuntu-22.04
            python_cmd: python3
            jobs: 2
          - id: macos-x86_64
            runner: macos-15-intel
            python_cmd: python3
            jobs: 2
          - id: macos-aarch64
            runner: macos-15
            python_cmd: python3
            jobs: 2
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact browser build authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: browser
          persist-credentials: false

      - name: Check out the resolved PyO3 binding source
        uses: actions/checkout@v4
        with:
          repository: AeroidesLab/py-darkpanda
          ref: ${{ needs.prepare.outputs.py_darkpanda_revision }}
          token: ${{ secrets.SOURCE_READ_TOKEN || secrets.CANVAS_READ_TOKEN }}
          fetch-depth: 1
          path: py-darkpanda
          persist-credentials: false

      - name: Download the shared Chromium bundle
        uses: actions/download-artifact@v4
        with:
          name: chromium-toolchain-${{ matrix.id }}
          path: toolchain-archive

      - name: Download the matching native runtime
        uses: actions/download-artifact@v4
        with:
          name: darkpanda-result-${{ matrix.id }}
          path: runtime-result

      - name: Install macOS CI shell prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify and unpack the Chromium bundle
        env:
          MSYS: winsymlinks:nativestrict
        shell: bash
        run: |
          set -euo pipefail
          archive="chromium-toolchain-${{ matrix.id }}.tar.gz"
          (
            cd toolchain-archive
            sha256sum --check "$archive.sha256"
          )
          mkdir -p toolchain
          tar -xzf "toolchain-archive/$archive" \
            -C toolchain \
            --strip-components=1

      - name: Enter the Visual Studio SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create the isolated Python build environment
        shell: bash
        run: |
          set -euo pipefail
          '${{ matrix.python_cmd }}' -m venv python-venv
          if [[ '${{ runner.os }}' == Windows ]]; then
            python_venv="$GITHUB_WORKSPACE/python-venv/Scripts/python.exe"
          else
            python_venv="$GITHUB_WORKSPACE/python-venv/bin/python"
          fi
          "$python_venv" -m pip install \
            --disable-pip-version-check \
            "maturin==$MATURIN_VERSION" \
            "pytest==$PYTEST_VERSION"
          echo "PYTHON_VENV=$python_venv" >> "$GITHUB_ENV"

      - name: Build and test the PyO3 wheel with the Chromium toolchain
        id: build_python
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_VENV" browser/tools/ci/build_python_wheel.py \
            --source py-darkpanda \
            --source-revision '${{ needs.prepare.outputs.py_darkpanda_revision }}' \
            --browser-revision "$GITHUB_SHA" \
            --runtime-results runtime-result \
            --toolchain-dir toolchain \
            --profile-sha256 '${{ needs.prepare.outputs.profile_sha256 }}' \
            --target '${{ matrix.id }}' \
            --python "$PYTHON_VENV" \
            --jobs '${{ matrix.jobs }}' \
            --output-dir "python-output/${{ matrix.id }}" \
            --report "python-reports/py-darkpanda-${{ matrix.id }}.json"

      - name: Preserve a machine-readable Python failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="python-reports/py-darkpanda-${{ matrix.id }}.json"
          if [[ ! -f $report ]] || ! jq -e . "$report" >/dev/null 2>&1; then
            mkdir -p python-reports
            jq -n \
              --arg target '${{ matrix.id }}' \
              --arg source '${{ needs.prepare.outputs.py_darkpanda_revision }}' \
              --arg browser "$GITHUB_SHA" \
              '{
                schema: "darkpanda-python-wheel/v1",
                status: "failed",
                target: $target,
                sourceRevision: $source,
                browserRevision: $browser,
                error: "Python wheel builder did not produce valid JSON"
              }' > "$report"
          fi
          {
            echo "## py-darkpanda / ${{ matrix.id }}"
            echo
            echo "- Result: \`$(jq -r .status "$report")\`"
            echo "- Wheel: \`$(jq -r '.wheel.name // ""' "$report")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Python wheel result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-result-${{ matrix.id }}
          path: |
            python-output/${{ matrix.id }}
            python-reports
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Enforce the Python wheel gate
        if: always()
        shell: bash
        run: |
          jq -e '.status == "passed"' \
            "python-reports/py-darkpanda-${{ matrix.id }}.json" >/dev/null

  fingerprint:
    name: fingerprint/windows-x86_64
    needs:
      - prepare
      - darkpanda
      - python
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.darkpanda.result == 'success' &&
      needs.python.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the exact browser build authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: browser
          persist-credentials: false

      - name: Download the Windows runtime
        uses: actions/download-artifact@v4
        with:
          name: darkpanda-result-windows-x86_64
          path: runtime-result

      - name: Download the Windows Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-result-windows-x86_64
          path: python-result

      - name: Install the fingerprint test environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv fingerprint-venv
          $python = Join-Path $env:GITHUB_WORKSPACE 'fingerprint-venv/Scripts/python.exe'
          $wheel = Get-ChildItem -LiteralPath python-result -Recurse -Filter '*.whl'
          if ($wheel.Count -ne 1) {
            throw "Expected one Windows wheel, found $($wheel.Count)"
          }
          & $python -m pip install `
            --disable-pip-version-check `
            $wheel[0].FullName `
            'websocket-client==1.8.0'
          "FINGERPRINT_PYTHON=$python" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Unpack the verified Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem `
            -LiteralPath runtime-result `
            -Recurse `
            -Filter '*.zip'
          if ($archive.Count -ne 1) {
            throw "Expected one Windows runtime archive, found $($archive.Count)"
          }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath runtime
          $library = Get-ChildItem -LiteralPath runtime -Recurse -Filter darkpanda.dll
          $wreq = Get-ChildItem -LiteralPath runtime -Recurse -Filter wreq.dll
          if ($library.Count -ne 1 -or $wreq.Count -ne 1) {
            throw 'The Windows runtime does not contain one darkpanda.dll and wreq.dll'
          }
          "DARKPANDA_LIBRARY=$($library[0].FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WREQ_LIBRARY=$($wreq[0].FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize the pinned Google Chrome Stable oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:FINGERPRINT_PYTHON `
            browser/tools/ci/materialize_google_chrome_stable.py `
            --profile browser/tools/ci/chromium-profile.json `
            --output chrome-oracle `
            --seven-zip 'C:\Program Files\7-Zip\7z.exe'

      - name: Capture official Chrome Stable and DarkPanda transport evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force fingerprint-evidence | Out-Null
          $chrome = Join-Path $env:GITHUB_WORKSPACE 'chrome-oracle/Chrome-bin/chrome.exe'
          $profile = Join-Path $env:GITHUB_WORKSPACE 'chrome-oracle-profile'
          $arguments = @(
            '--remote-debugging-port=9222',
            "--user-data-dir=$profile",
            '--no-first-run',
            '--no-default-browser-check',
            'about:blank'
          )
          $process = Start-Process -FilePath $chrome -ArgumentList $arguments -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..120) {
              try {
                Invoke-RestMethod 'http://127.0.0.1:9222/json/version' | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              throw 'Google Chrome Stable DevTools endpoint did not start'
            }
            & $env:FINGERPRINT_PYTHON `
              browser/tests/chrome_stable_tls_capture.py `
              --chrome-binary $chrome `
              --materialization chrome-oracle/materialization.json `
              --endpoint 'http://127.0.0.1:9222' `
              --phase cold `
              --out fingerprint-evidence/chrome-cold.json
            & $env:FINGERPRINT_PYTHON browser/tests/creepjs_probe.py chrome `
              --endpoint 'http://127.0.0.1:9222' `
              --out fingerprint-evidence/chrome-creepjs.json
          } finally {
            Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -like "*$profile*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

          & $env:FINGERPRINT_PYTHON browser/tests/ffi_tls_peet.py `
            --library $env:DARKPANDA_LIBRARY `
            --wreq $env:WREQ_LIBRARY `
            --out fingerprint-evidence/wreq-cold.json
          & $env:FINGERPRINT_PYTHON browser/tests/creepjs_probe.py darkpanda `
            --library $env:DARKPANDA_LIBRARY `
            --wreq $env:WREQ_LIBRARY `
            --out fingerprint-evidence/darkpanda-creepjs.json

      - name: Enforce TLS, HTTP/2, and header-order parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:FINGERPRINT_PYTHON browser/tests/tls_fingerprint_compare.py `
            --chrome-cold fingerprint-evidence/chrome-cold.json `
            --wreq-cold fingerprint-evidence/wreq-cold.json `
            2>&1 | Tee-Object fingerprint-evidence/comparison.log
          & $env:FINGERPRINT_PYTHON browser/tests/creepjs_probe.py compare `
            --chrome fingerprint-evidence/chrome-creepjs.json `
            --darkpanda fingerprint-evidence/darkpanda-creepjs.json `
            2>&1 | Tee-Object fingerprint-evidence/creepjs-comparison.log

      - name: Upload fingerprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-windows-x86_64
          path: |
            chrome-oracle/materialization.json
            fingerprint-evidence
          if-no-files-found: warn
          retention-days: 30

  fingerprint-recovery:
    name: fingerprint/windows-x86_64
    if: inputs.fingerprint_source_run_id != ''
