          set -euo pipefail
          python3 browser/tools/ci/aggregate_darkpanda_reports.py \
            --results platform-results \
            --resolved-inputs resolved-inputs/resolved-inputs.json \
            --output aggregate/summary.json \
            --markdown aggregate/summary.md \
            --release-dir release

