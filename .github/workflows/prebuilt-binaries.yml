          python3 browser/tools/ci/aggregate_python_wheels.py \
            --results python-results \
            --resolved-inputs resolved-inputs/resolved-inputs.json \
            --release-dir release \
            --output aggregate/python-summary.json \
            --markdown aggregate/python-summary.md

      - name: Ensure the aggregate failure is machine-readable
        if: always()
        shell: bash
        run: |
          mkdir -p aggregate
          if [[ ! -f aggregate/summary.json ]]; then
            jq -n \
              --arg platforms '${{ steps.download_platforms.outcome }}' \
              --arg inputs '${{ steps.download_inputs.outcome }}' \
              --arg validator '${{ steps.validate_native.outcome }}' \
              '{
                schema: "darkpanda-prebuilt-aggregate/v1",
                status: "failed",
                platforms: {},
                errors: [
                  "aggregate validator could not run",
                  ("platform download: " + $platforms),
                  ("resolved input download: " + $inputs),
                  ("validator: " + $validator)
                ]
              }' > aggregate/summary.json
          fi
          if [[ ! -f aggregate/summary.md ]]; then
            printf '%s\n' \
              '## DarkPanda cross-platform aggregate' \
              '' \
              '- Status: `failed`' \
              '- The aggregate validator could not run.' \
              > aggregate/summary.md
          fi
          if [[ ! -f aggregate/python-summary.json ]]; then
            jq -n \
              --arg download '${{ steps.download_python.outcome }}' \
              --arg validator '${{ steps.validate_python.outcome }}' \
              '{
                schema: "darkpanda-python-aggregate/v1",
                status: "failed",
                platforms: {},
                errors: [
                  "Python aggregate validator could not run",
                  ("Python result download: " + $download),
                  ("Python validator: " + $validator)
                ]
              }' > aggregate/python-summary.json
          fi
          if [[ ! -f aggregate/python-summary.md ]]; then
            printf '%s\n' \
              '## py-darkpanda wheels' \
              '' \
              '- Status: `failed`' \
              '- The Python aggregate validator could not run.' \
              > aggregate/python-summary.md
          fi

      - name: Publish the final build summary
        if: always()
        shell: bash
        run: |
          if [[ -f aggregate/summary.md ]]; then
            cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' \
              '## DarkPanda cross-platform aggregate' \
              '' \
              'The aggregate validator did not produce a report.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f aggregate/python-summary.md ]]; then
            cat aggregate/python-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkpanda-aggregate-report
          path: aggregate
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the complete verified prebuilt set
        if: steps.validate_native.outcome == 'success' && steps.validate_python.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: darkpanda-prebuilt-all
          path: release
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Enforce the final cross-platform gate
        if: always()
        shell: bash
        run: |
          test '${{ needs.prepare.result }}' = success
          test '${{ needs.native-summary.result }}' = success
          test '${{ needs.darkpanda.result }}' = success
          test '${{ needs.python.result }}' = success
          test '${{ needs.fingerprint.result }}' = success
          test '${{ steps.download_platforms.outcome }}' = success
          test '${{ steps.download_python.outcome }}' = success
          test '${{ steps.download_inputs.outcome }}' = success
          test '${{ steps.validate_native.outcome }}' = success
          test '${{ steps.validate_python.outcome }}' = success

  release:
    name: release
    needs:
      - aggregate
    if: needs.aggregate.result == 'success' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified prebuilt set
        uses: actions/download-artifact@v4
        with:
          name: darkpanda-prebuilt-all
          path: release

      - name: Publish or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.0.0-ci.${GITHUB_RUN_NUMBER}"
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -ge 17
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DarkPanda CI ${GITHUB_RUN_NUMBER}" \
              --notes "Verified Windows/Linux/macOS native runtimes and PyO3 wheels for commit $GITHUB_SHA." \
              --prerelease \
              "${assets[@]}"
          fi
          gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json url \
            --jq '"Release: " + .url' >> "$GITHUB_STEP_SUMMARY"
