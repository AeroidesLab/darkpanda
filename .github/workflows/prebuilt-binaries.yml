  aggregate:
    name: package
    needs:
      - prepare
      - native-summary
      - darkpanda
      - python
      - fingerprint
    if: always() && inputs.fingerprint_source_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Download every DarkPanda platform result
        id: download_platforms
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: darkpanda-result-*
          path: platform-results

      - name: Download every Python wheel result
        id: download_python
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: python-result-*
          path: python-results

      - name: Download the resolved source graph
        id: download_inputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: resolved-inputs
          path: resolved-inputs

      - name: Check out the aggregate validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: browser
          persist-credentials: false

